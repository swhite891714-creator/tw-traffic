<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="apple-mobile-web-app-title" content="路況影像"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#19a56b"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>台灣路況即時影像</title></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* 版面概念：左邊（手機在上方）是一張可以縮放的台灣地圖，點哪裡就看哪裡；右邊（手機在下方）是地圖範圍內的攝影機 */
:root{
  --bg:#eef1ee;
  --panel:#ffffff;
  --ink:#16201b;
  --muted:#5d6b63;
  --line:#d3dad5;
  --land:#f8faf8;          /* 陸地 */
  --land-hi:#e3efe8;       /* 滑過或選取的縣市 */
  --sea:#dbe6ee;           /* 海 */
  --border:#7f938a;        /* 縣市界線 */
  --tline:#c3cfc8;         /* 鄉鎮市區界線 */
  --town-hi:#cfe6d8;       /* 選取的區域 */
  --fw:#0b6b45;            /* 國道綠 */
  --fw-ink:#ffffff;
  --pr:#1f4fa3;            /* 省道藍 */
  --ct:#8b3fd9;            /* 市區紫 */
  --pr-ink:#ffffff;
  --live:#d9480f;
  --chip:#e2e8e4;
  --star:#c98a00;
  --shade:rgba(10,20,15,.82);
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-num:"Barlow Condensed","Noto Sans TC",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101512;--panel:#18201b;--ink:#e6ece8;--muted:#9aa9a0;--line:#2b3630;
  --land:#1f2823;--land-hi:#2a3a31;--sea:#0d1420;--border:#6a7d72;--tline:#33413a;--town-hi:#2f4a3b;
  --fw:#19a56b;--fw-ink:#ffffff;--pr:#4f86e6;--pr-ink:#ffffff;--ct:#b07cf0;--live:#ff6b35;--chip:#232d27;--star:#f0b429;--shade:rgba(0,0,0,.88);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101512;--panel:#18201b;--ink:#e6ece8;--muted:#9aa9a0;--line:#2b3630;
  --land:#1f2823;--land-hi:#2a3a31;--sea:#0d1420;--border:#6a7d72;--tline:#33413a;--town-hi:#2f4a3b;
  --fw:#19a56b;--fw-ink:#ffffff;--pr:#4f86e6;--pr-ink:#ffffff;--ct:#b07cf0;--live:#ff6b35;--chip:#232d27;--star:#f0b429;--shade:rgba(0,0,0,.88);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
h1{margin:0;font-size:22px;font-weight:900;letter-spacing:.02em;text-wrap:balance}
.sub{color:var(--muted);font-size:13px}
.sub b{font-family:var(--font-num);font-size:16px;color:var(--ink)}
.search{margin-top:12px;position:relative}
.search input{width:100%;font:inherit;font-size:16px;padding:11px 14px 11px 40px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.search input:focus{outline:2px solid var(--fw);outline-offset:1px}
.search svg{position:absolute;left:13px;top:23px;transform:translateY(-50%);color:var(--muted)}
.srow{display:flex;gap:8px}
.srow .sbox{position:relative;flex:1;min-width:0}
.search input{padding-right:36px}
.qx{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:30px;height:30px;border:0;border-radius:50%;background:transparent;color:var(--muted);font-size:16px;cursor:pointer}
.nearme{flex:none;font:inherit;font-size:14px;font-weight:700;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:0 12px;cursor:pointer;white-space:nowrap}
/* 打字時跳出的地點建議 */
.sug{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);max-height:min(60vh,430px);overflow:auto;padding:4px}
.sug button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;background:none;border:0;border-radius:8px;padding:9px 10px;color:var(--ink);cursor:pointer}
.sug button[aria-selected="true"],.sug button:hover{background:var(--chip)}
.sug .ic{flex:none;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--chip);color:var(--muted)}
.sug .ic.lm{background:#e8590c;color:#fff}.sug .ic.ar{background:#1c7ed6;color:#fff}.sug .ic.ic2{background:var(--fw);color:#fff}.sug .ic.rd{background:var(--ink);color:var(--bg)}.sug .ic.web{background:#2b8a3e;color:#fff}
.sug .tx{flex:1;min-width:0}
.sug .nm{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sug .nm mark{background:none;color:var(--fw)}
.sug .sb{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sug .ct{flex:none;font-size:12px;color:var(--muted);font-family:var(--font-num)}
.sug .msg{padding:10px 12px;font-size:13px;color:var(--muted)}
.sug .grp{padding:6px 10px 2px;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.05em}
.nearx{font:inherit;font-size:13px;font-weight:700;border:0;background:var(--chip);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.dist{display:inline-block;font-family:var(--font-num);font-weight:700;color:#e8590c;margin-right:4px}
.pin{pointer-events:none}
/* 更新清單按鈕與提示 */
.updrow{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;margin-left:4px}
.updbtn{font:inherit;font-size:13px;font-weight:700;border:1.5px solid var(--fw);color:var(--fw);background:var(--panel);border-radius:999px;padding:4px 12px;cursor:pointer}
.updbtn.first{background:var(--ct);border-color:var(--ct);color:#fff}
.updbtn:disabled{opacity:.7;cursor:progress}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;max-width:min(92vw,520px);background:var(--ink);color:var(--bg);font-size:14px;font-weight:600;line-height:1.45;padding:12px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.3);cursor:pointer}
#vframe{width:100%;aspect-ratio:16/10;border:0;background:#000;display:block}
@media (max-width:520px){
  #legend.legend{gap:4px;left:8px;right:8px;bottom:8px}
  #legend .lbl{display:none}
  #legend .lyr{font-size:12.5px;padding:5px 8px;min-height:32px}
  #legend .lyr .ck{margin-left:1px}
  .legend #lg-ic{display:none}
}
/* 加入最愛按鈕：有字、比較明顯 */
.star.favb{flex:none;font:inherit;font-size:13px;font-weight:700;line-height:1.2;border:1.5px solid var(--star);color:var(--star);background:transparent;border-radius:999px;padding:4px 10px;cursor:pointer;white-space:nowrap}
.star.favb[aria-pressed="true"]{background:var(--star);color:#fff}
.pick .acts .star.favb{flex:none;border-radius:8px;padding:8px 12px;font-size:14px}
/* 搜尋後的「附近路況」速覽 */
.nearbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.nbhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin-bottom:10px}
.nbhead b{font-size:16px}
.nbhead span{font-size:12px;color:var(--muted)}
.nbgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:900px){.nbgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.nbt{position:relative;display:block;aspect-ratio:352/240;background:#0d1210;border:0;padding:0;border-radius:10px;overflow:hidden;cursor:zoom-in;text-decoration:none;width:100%}
.nbt img{width:100%;height:100%;object-fit:cover;display:block}
.nbt .nbl{position:absolute;left:0;right:0;bottom:0;padding:16px 8px 6px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;font-size:12px;font-weight:700;text-align:left;line-height:1.3}
.nbt .nbl small{display:block;font-weight:500;opacity:.85}
.nbt .ph{color:#cfd8d3}
.nbacts{display:flex;gap:8px;margin-top:10px}
.nbacts button{flex:1;font:inherit;font-size:14px;font-weight:700;border:0;border-radius:8px;padding:9px;cursor:pointer;background:var(--chip);color:var(--ink)}
.nbacts button.pri{background:var(--fw);color:var(--fw-ink)}
/* 景點直播 */
.chip.spot{color:#e8590c;font-weight:700}
.chip.spot[aria-pressed="true"]{background:#e8590c;color:#fff}
.chip.spot[aria-pressed="true"] .n{color:#fff}
.sug .ic.sp{background:#e8590c;color:#fff}
.legend .sq{display:inline-block;width:10px;height:10px;border-radius:3px;background:#e8590c;margin-right:4px;vertical-align:middle}
.spcard .shot,.pick .spcard .shot{aspect-ratio:16/9;max-height:30vh}
.spcard .shot img,.pick .spcard .shot img{object-fit:cover}
.spcard .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:54px;height:38px;border-radius:10px;background:rgba(0,0,0,.65);color:#fff;display:grid;place-items:center;font-size:18px;pointer-events:none}
.spname{font-size:16px;font-weight:700;line-height:1.3}
.spbadge{flex:none;width:34px;height:34px;border-radius:9px;background:#e8590c;color:#fff;display:grid;place-items:center;font-size:15px}
.open.sp{background:#e8590c;color:#fff}
.locate.off{background:var(--chip);color:var(--ink)}
.spnote{display:flex;align-items:center;gap:8px;width:100%;margin-top:10px;font:inherit;font-size:14px;font-weight:700;text-align:left;color:#e8590c;background:var(--panel);border:1px solid #e8590c;border-radius:10px;padding:10px 12px;cursor:pointer}
.yt{position:relative;width:100%;aspect-ratio:16/9;background:#000}
.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.scroller{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
/* 選項太多時先收成幾行，按「顯示全部」再展開，不用左右滑 */
.clip{overflow:hidden}
.morebtn{display:inline-flex;align-items:center;gap:4px;margin-top:6px;font:inherit;font-size:13px;font-weight:700;color:var(--fw);background:none;border:0;padding:4px 2px;cursor:pointer}
.chip{flex:none;font:inherit;font-size:14px;border:1px solid transparent;background:var(--chip);color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chip .n{font-family:var(--font-num);opacity:.65;margin-left:4px}
.chip.fav{color:var(--star);font-weight:700}
.chip.fav[aria-pressed="true"]{color:var(--bg)}
button:focus-visible,a:focus-visible,svg:focus-visible{outline:2px solid var(--fw);outline-offset:2px}

.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;margin-top:12px}
@media (min-width:900px){
  .layout{grid-template-columns:minmax(360px,440px) minmax(0,1fr);align-items:start}
  .mapcol{position:sticky;top:12px}
}
/* 地圖 */
.mapbox{position:relative;background:var(--sea);border-radius:14px;overflow:hidden;border:1px solid var(--line);height:min(58vh,520px);touch-action:none;user-select:none;-webkit-user-select:none}
@media (min-width:900px){.mapbox{height:calc(100vh - 140px);max-height:820px;min-height:520px}}
/* 地圖分三層：底圖（縣市、區域）→ 細節畫布（村里、道路、文字）→ 攝影機點 */
.maplayer{position:absolute;inset:0;width:100%;height:100%;display:block}
#mapbase,#detail{pointer-events:none}
#map{cursor:grab}
#map.drag{cursor:grabbing}
.county{fill:var(--land);stroke:none}
.county.on{fill:var(--land-hi)}
.town{fill:transparent;stroke:var(--tline);stroke-linejoin:round;vector-effect:non-scaling-stroke;stroke-width:.8}
.town.on{fill:var(--town-hi)}
.cb{fill:none;stroke:var(--border);stroke-linejoin:round;vector-effect:non-scaling-stroke;stroke-width:1.5;pointer-events:none}
.tlabel{fill:var(--ink);opacity:.7;font-family:var(--font-body);font-weight:500;text-anchor:middle;dominant-baseline:middle;pointer-events:none;paint-order:stroke;stroke:var(--land);stroke-width:3px;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.tlabel.on{opacity:1;font-weight:700}
.chip.zero{opacity:.45}
.clabel{fill:var(--muted);font-family:var(--font-body);font-weight:700;text-anchor:middle;dominant-baseline:middle;pointer-events:none;paint-order:stroke;stroke:var(--land);stroke-width:3px;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.dots circle{r:var(--r,6px)}
.dots.deep circle{stroke:var(--land);stroke-width:1.5px;vector-effect:non-scaling-stroke}
.dots circle.cand{stroke:var(--live);stroke-width:2.5px;vector-effect:non-scaling-stroke}
.hov{fill:none;stroke:var(--ink);vector-effect:non-scaling-stroke;stroke-width:2;pointer-events:none}
.tip{position:absolute;pointer-events:none;background:var(--panel);color:var(--ink);font-size:12.5px;line-height:1.35;padding:6px 9px;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.25);max-width:240px;z-index:3}
.tip b{font-family:var(--font-num);font-size:15px}
.choices{display:flex;flex-direction:column;max-height:42vh;overflow:auto;padding:0 6px 8px}
.choice{display:flex;gap:10px;align-items:center;text-align:left;border:0;background:none;padding:8px;border-radius:8px;cursor:pointer;color:var(--ink);font:inherit;width:100%}
.choice:hover,.choice:focus-visible{background:var(--chip)}
.choice .txt{display:flex;flex-direction:column;min-width:0}
.choice .km{font-size:17px}
/* 沿著同一條路切換上一支、下一支 */
.nav{display:flex;align-items:center;gap:6px;padding:0 12px 10px}
.navb{flex:none;display:flex;align-items:center;gap:4px;font:inherit;font-size:13px;font-weight:700;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:7px 10px;cursor:pointer;min-height:36px}
.navb:hover{border-color:var(--ink)}
.navb .ar{font-size:15px;line-height:1}
.navb small{font-family:var(--font-num);font-size:14px;color:var(--muted);font-weight:700}
.navt{flex:1;min-width:0;text-align:center;font-size:12px;color:var(--muted);line-height:1.3}
.navb[disabled]{visibility:hidden}
.dot-fw{fill:var(--fw)}
.dot-pr{fill:var(--pr)}
.dots.dim circle{opacity:.18}
.dots.dim circle.hit{opacity:1}
.sel{fill:none;stroke:var(--live);vector-effect:non-scaling-stroke;stroke-width:3}
.mapctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:44px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:20px;line-height:1;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.maphint{position:absolute;left:10px;top:10px;right:60px;font-size:12.5px;background:var(--panel);color:var(--ink);border-radius:10px;padding:6px 10px;box-shadow:0 1px 3px rgba(0,0,0,.12);pointer-events:none;width:max-content;max-width:calc(100% - 70px)}
.legend{position:absolute;left:10px;bottom:10px;right:10px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;pointer-events:none}
.legend > *{pointer-events:auto}
.legend .lbl{background:var(--panel);color:var(--muted);font-size:12px;font-weight:700;padding:6px 8px;border-radius:999px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.lyr{display:flex;align-items:center;gap:2px;font:inherit;font-size:13px;font-weight:700;border:1.5px solid transparent;background:var(--panel);color:var(--ink);padding:6px 11px;border-radius:999px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.15);min-height:34px}
.lyr[aria-pressed="true"]{border-color:var(--ink)}
.lyr[aria-pressed="false"]{color:var(--muted);opacity:.75}
.lyr[aria-pressed="false"] i,.lyr[aria-pressed="false"] .sq{filter:grayscale(1);opacity:.5}
.lyr .ck{font-size:11px;margin-left:3px}
.legend #lg-ic{background:var(--panel);padding:6px 10px;border-radius:999px;box-shadow:0 1px 3px rgba(0,0,0,.15);font-size:12px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle}
/* 地圖上選到的攝影機 */
.pick{position:absolute;left:10px;right:10px;bottom:10px;background:var(--panel);border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.25);overflow:hidden}
.pick .row{display:flex;align-items:center;gap:10px;padding:10px 12px}
.pick .txt{flex:1;min-width:0}
.pick .shot{aspect-ratio:352/240;max-height:34vh;width:100%;background:#0d1210;display:block;border:0;padding:0;cursor:zoom-in;position:relative}
.pick .shot img{width:100%;height:100%;object-fit:contain;display:block}
.pick .acts{display:flex;gap:8px;padding:0 12px 12px}
.pick .acts > *{flex:1}
.x{border:0;background:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1;padding:2px 4px}

/* 道路標誌 */
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:26px;padding:0 6px;font-family:var(--font-num),var(--font-body);font-weight:700;font-size:15px;line-height:1;flex:none}
.badge.fw{background:var(--fw);color:var(--fw-ink);border-radius:6px}
.badge.pr{background:var(--pr);color:var(--pr-ink);clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%);height:28px;padding-bottom:5px;border-radius:2px}
.badge.ct{background:var(--ct);color:#fff;border-radius:999px;font-size:13px}
.badge.co{background:var(--panel);color:var(--ink);border:1.5px solid var(--ink);border-radius:3px}
.badge.lg{min-width:56px;height:32px;font-size:18px}

/* 清單 */
.listhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.listhead h2{margin:0;font-size:18px;font-weight:700}
.roads{display:flex;flex-wrap:wrap;gap:6px;padding-top:8px}
.road{flex:none;display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:13px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px 9px 3px 3px;cursor:pointer;color:var(--ink)}
.road[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.road .n{font-family:var(--font-num);color:var(--muted);font-size:14px}
.road.all{padding:5px 12px}
.dirs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.dirs .lbl{font-size:12px;color:var(--muted);align-self:center;margin-right:2px}
.note{margin-top:10px;font-size:13px;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:10px;padding:8px 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:10px}
.cam{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.cam.on{border-color:var(--live);box-shadow:0 0 0 1px var(--live)}
.cam .shot{position:relative;aspect-ratio:352/240;max-width:100%;background:#0d1210;cursor:zoom-in;display:block;border:0;padding:0;width:100%}
.cam .shot img{width:100%;height:100%;object-fit:cover;display:block}
.ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8fa198;font-size:13px;text-align:center;padding:10px}
.tag{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:2px 7px;border-radius:999px;display:flex;align-items:center;gap:5px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--live);display:inline-block}
.meta{display:flex;align-items:flex-start;gap:8px;padding:10px 10px 8px 12px}
.meta .txt{flex:1;min-width:0}
.km{font-family:var(--font-num);font-size:20px;font-weight:700;line-height:1.1}
.km small{font-family:var(--font-body);font-size:12px;font-weight:500;color:var(--muted);margin-left:6px}
.secline{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.star{flex:none;border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:2px 4px}
.star[aria-pressed="true"]{color:var(--star)}
.btns{display:flex;gap:6px;padding:0 10px 10px}
.open,.locate{display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;font:inherit;font-size:13.5px;font-weight:700;border-radius:8px;padding:8px;cursor:pointer;border:0}
.open{flex:1;color:var(--fw-ink);background:var(--fw)}
.locate{background:var(--chip);color:var(--ink);padding:8px 10px}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:32px 12px;background:var(--panel);border-radius:12px;border:1px dashed var(--line)}
.more{display:block;margin:14px auto 0;font:inherit;background:var(--chip);border:0;border-radius:999px;padding:8px 18px;cursor:pointer;color:var(--ink)}
footer{margin-top:28px;font-size:12px;color:var(--muted)}
/* 放大檢視 */
.viewer{position:fixed;inset:0;background:var(--shade);z-index:20;display:flex;align-items:center;justify-content:center;padding:calc(12px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.vbox{width:min(960px,100%);background:#000;border-radius:12px;overflow:hidden}
.vbox img{width:100%;aspect-ratio:352/240;object-fit:contain;display:block;background:#000}
.vbar{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#111;color:#eee;flex-wrap:wrap}
.vbar .txt{flex:1;min-width:0}
.vbar .km{color:#fff}
.vbar .secline{color:#aab}
.vbtn{font:inherit;font-size:14px;background:#2a2f2c;color:#fff;border:0;border-radius:8px;padding:8px 12px;cursor:pointer;text-decoration:none}
.vbtn:disabled{opacity:.35;cursor:default}
@media (max-width:520px){
  h1{font-size:20px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .km{font-size:17px}
  .meta{padding:8px;gap:4px;flex-wrap:wrap}
  .meta .txt{order:3;flex-basis:100%}
  .meta .star{margin-left:auto}
  .star.favb{font-size:12px;padding:3px 8px}
  .btns{padding:0 8px 8px;flex-direction:column}
  .open,.locate{font-size:13px;padding:7px}
}

@keyframes pulse{50%{opacity:.25}}

<script>
(function(){
  const $ = id => document.getElementById(id);
  const SVGNS = 'http://www.w3.org/2000/svg';

  // ===== 讀入內嵌資料 =====
  const META = JSON.parse($('meta').textContent);
  const XY = $('xy').textContent.trim();
  const RAW = $('camdata').textContent.trim().split('\n');
  const THB_LETTERS = 'abcdefgh';
  const DIRS = {N:'北上',S:'南下',E:'東向',W:'西向'};

  // ===== 解析攝影機 =====
  const cams = [];
  let county = 0, road = 0, prefix = '';
  for (const line of RAW){
    if (!line) continue;
    if (line[0] === '#'){ const p = line.slice(1).split(','); county = +p[0]; road = +p[1]; prefix = p[2] || ''; continue; }
    if (/^\d/.test(line)){
      // 國道：主機,攝影機編號,方向,公里,路段
      const [h, id, d, km, s] = line.split(',');
      const host = META.H[+h];
      const isS = host.startsWith('cctvs');
      const q = 'camera=' + encodeURIComponent(id);
      cams.push({c:county, r:road, kind:'fw', dir:d || '', km: km === '' ? null : +km,
        sec: s === '' || s == null ? '' : META.S[+s],
        live: 'https://' + host + (isS ? '/live-view/mjpg/video.cgi?' : '/abs2mjpg/bmjpg?') + q,
        snap: 'https://' + host + (isS ? '/live-view/jpg/image.cgi?' : '/abs2mjpg/jpg?') + q,
        key: host + '|' + id});
    } else {
      // 省道：主機代號 + 路徑尾段（! 開頭代表完整路徑）
      const host = META.H[4 + THB_LETTERS.indexOf(line[0])];
      const rest = line.slice(1);
      const path = rest[0] === '!' ? rest.slice(1) : prefix + '-' + rest;
      const label = rest[0] === '!' ? rest.slice(1) : rest;
      cams.push({c:county, r:road, kind:'pr', dir:'', km: thbKm(label), stake: prettyStake(label), sec:'',
        live: 'https://' + host + '/' + encodeURI(path), snap: null, key: host + '|' + path});
    }
  }
  cams.forEach((c,i) => c.i = i);

  // ===== 座標：依影像網址排序後依序對應（每支 4 個字元，x、y 各兩個 64 進位字元） =====
  const A = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz-_';
  const dec = s => A.indexOf(s[0]) * 64 + A.indexOf(s[1]);
  const order = cams.map(c => ({c, u: decodeURI(c.live)})).sort((a,b) => a.u < b.u ? -1 : a.u > b.u ? 1 : 0);
  const TW = $('tw').textContent.trim();
  order.forEach((o, k) => { o.c.x = dec(XY.substr(k*4, 2)); o.c.y = dec(XY.substr(k*4 + 2, 2)); o.c.t = dec(TW.substr(k*2, 2)); });

  // ===== 精確座標（約 12 公尺精度）：用影像網址的雜湊對應，每支 11 個字元 =====
  {
    const FINE = $('fine').textContent.trim();
    const decN = s => { let v = 0; for (const ch of s) v = v * 64 + A.indexOf(ch); return v; };
    const enc = new TextEncoder();
    const fnv = s => { let h = 0x811c9dc5; for (const b of enc.encode(s)){ h ^= b; h = Math.imul(h, 0x01000193) >>> 0; } return h >>> 2; };
    const fm = new Map();
    for (let k = 0; k + 11 <= FINE.length; k += 11) fm.set(decN(FINE.substr(k, 5)), [decN(FINE.substr(k + 5, 3)) / 8, decN(FINE.substr(k + 8, 3)) / 8]);
    order.forEach(o => { const f = fm.get(fnv(o.u)); if (f){ o.c.x = f[0]; o.c.y = f[1]; } });
  }

  // ===== 鄉鎮市區：共用邊界線（變長編碼）+ 每個區由哪些邊界組成 =====
  function vints(s){
    const out = []; let z = 0, mul = 1;
    for (const ch of s){
      const d = A.indexOf(ch);
      z += (d & 31) * mul;
      if (d >= 32) mul *= 32; else { out.push(z % 2 ? -(z + 1) / 2 : z / 2); z = 0; mul = 1; }
    }
    return out;
  }
  // 邊界線（村里、鄉鎮市區、縣市共用同一份，內政部資料）
  const ARCS = $('varcs').textContent.trim().split(' ').map(s => {
    const v = vints(s); let x = v[0], y = v[1]; const pts = [[x / 8, y / 8]];
    for (let k = 2; k < v.length; k += 2){ x += v[k]; y += v[k + 1]; pts.push([x / 8, y / 8]); }
    return pts;
  });
  // 每條線屬於哪一級：2＝縣市界或海岸，1＝鄉鎮市區界，0＝村里界
  const ARC_KIND = new Uint8Array(ARCS.length);
  const ARC_BOX = ARCS.map(a => { let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; for (const [x, y] of a){ if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; } return [x0, y0, x1, y1]; });
  const ringRefs = s => s ? s.split(';').map(vints) : [];
  const ringPts = refs => refs.flatMap(a => a >= 0 ? ARCS[a] : ARCS[~a].slice().reverse());
  const TR = $('trings').textContent.split('\n').map(ringRefs);
  const CR = $('crings').textContent.split('\n').map(ringRefs);
  TR.forEach(rs => rs.forEach(r => r.forEach(a => { const i = a >= 0 ? a : ~a; if (!ARC_KIND[i]) ARC_KIND[i] = 1; })));
  CR.forEach(rs => rs.forEach(r => r.forEach(a => { ARC_KIND[a >= 0 ? a : ~a] = 2; })));
  const f1 = v => Math.round(v * 10) / 10;
  const pathD = rings => rings.map(r => 'M' + r.map(p => f1(p[0]) + ' ' + f1(p[1])).join('L') + 'Z').join('');
  function bigCentroid(rings){
    let best = null, ba = 0;
    for (const r of rings){
      let a = 0, cx = 0, cy = 0;
      for (let k = 0, j = r.length - 1; k < r.length; j = k++){ const f = r[j][0] * r[k][1] - r[k][0] * r[j][1]; a += f; cx += (r[j][0] + r[k][0]) * f; cy += (r[j][1] + r[k][1]) * f; }
      if (Math.abs(a) > ba){ ba = Math.abs(a); best = [cx / (3 * a), cy / (3 * a)]; }
    }
    return [best, ba / 2];
  }
  const COUNTIES = META.C.map((name, i) => { const rings = CR[i].map(ringPts); const [lp] = bigCentroid(rings); return {name, d: pathD(rings), lx: lp[0], ly: lp[1]}; });
  // 村里名稱
  const VILLS = $('vills').textContent.trim().split('\n').map(line => {
    const [name, ti, xy, lv] = line.split(','); const v = vints(xy);
    return {name, t: +ti, x: v[0] / 8, y: v[1] / 8, lv: +lv};
  });
  const TOWNS = $('townlist').textContent.trim().split('\n').map((line, i) => {
    const [name, ci] = line.split(',');
    const rings = TR[i].map(ringPts);
    // 標籤位置：最大那一塊的重心
    const [best, area] = bigCentroid(rings);
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (const r of rings) for (const [x, y] of r){ if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    return {i, name, c: +ci, county: META.C[+ci], d: pathD(rings),
      lx: best[0], ly: best[1], box: {x: x0, y: y0, w: x1 - x0, h: y1 - y0}, area};
  });
  const townName = c => TOWNS[c.t] ? TOWNS[c.t].name : '';
  // 景點直播（資料在後面搜尋區塊建立，地圖會用到所以先宣告）
  let SPOTS = [];
  const place = c => (META.C[c.c] || c.cname || '') + townName(c);

  function thbKm(s){ const m = s.match(/(\d+)\s*[Kk]\s*[+-]?\s*(\d*)/); return m ? +m[1] + (m[2] ? +('0.' + m[2]) : 0) : null; }
  function prettyStake(s){
    return s.replace(/^0+(\d)/,'$1').replace(/k/,'K')
      .replace(/\(N\)|N$/,' · 北向').replace(/\(S\)|S$/,' · 南向')
      .replace(/\(E\)|E$/,' · 東向').replace(/\(W\)|W$/,' · 西向')
      .replace(/\(R\)/,' · 匝道').replace(/\(L\)/,'');
  }
  function roadBadge(name){
    let m;
    if ((m = name.match(/^國道(\d+)(號|甲)?(.*)$/))) return {cls:'fw', t:'國' + m[1] + (m[2] === '甲' ? '甲' : '') + (m[3] ? '高架' : '')};
    if (name === '高港高架') return {cls:'fw', t:'高港'};
    if (name === '港西聯絡道') return {cls:'fw', t:'港西'};
    if (name === '南港聯絡道') return {cls:'fw', t:'南港'};
    if ((m = name.match(/^台(.+?)線?$/))) return {cls:'pr', t:'台' + m[1]};
    if ((m = name.match(/^縣道(\d+)線$/))) return {cls:'co', t:m[1]};
    return {cls:'co', t:name.replace('便道','')};
  }
  const badgeHTML = (r, big) => { const b = CTR.has(r) ? {cls: 'ct', t: '市區'} : roadBadge(META.R[r]); return '<span class="badge ' + b.cls + (big ? ' lg' : '') + '">' + esc(b.t) + '</span>'; };
  function esc(s){ return String(s).replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch])); }
  const kmText = c => c.kind === 'ct' ? META.R[c.r] : c.kind === 'fw' ? (c.km == null ? '' : c.km.toFixed(1) + 'K') : (c.stake || '');
  const CTD = {N: '往北', S: '往南', E: '往東', W: '往西'};
  const dirText = c => c.kind === 'ct' ? (CTD[c.dir] || '') : (DIRS[c.dir] || '');
  function roadNo(name){ const m = name.match(/\d+/); return m ? +m[0] + (/甲|高架/.test(name) ? 0.5 : 0) : 99; }

  // ===== 只存在這台裝置的設定 =====
  const store = {
    get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
    set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
  };
  let favs = new Set(store.get('tw-cctv-favs', []));
  const state = {mode: 'map', road: null, dir: '', q: '', county: null, town: null, pick: null, cand: new Set(), near: null, spick: null};
  // 地圖顯示開關：國道、省道（景點由「景點模式」控制）
  state.layers = Object.assign({fw: true, pr: true, ct: true}, store.get('tw-cctv-layers', {}));
  if (!state.layers.fw && !state.layers.pr && !state.layers.ct) state.layers = {fw: true, pr: true, ct: true};
  let limit = 60;
  let canEmbed = null;

  $('total').textContent = cams.length.toLocaleString('zh-TW');

  // ===== 畫地圖 =====
  const svg = $('map');
  const ORDER = ['基隆市','台北市','新北市','桃園市','新竹市','新竹縣','苗栗縣','台中市','彰化縣','南投縣','雲林縣','嘉義市','嘉義縣','台南市','高雄市','屏東縣','宜蘭縣','花蓮縣','台東縣'];
  const countyEls = {};
  {
    let h = '', lh = '';
    for (const cn of COUNTIES){
      h += '<path class="county" data-name="' + cn.name + '" d="' + cn.d + '"></path>';
      lh += '<text class="clabel" x="' + f1(cn.lx) + '" y="' + f1(cn.ly) + '">' + cn.name + '</text>';
    }
    $('counties-g').innerHTML = h;
    $('cborder-g').innerHTML = h.replace(/class="county"/g, 'class="cb"');
    $('labels-g').innerHTML = lh;
    $('towns-g').innerHTML = TOWNS.map(tn => '<path class="town" data-t="' + tn.i + '" d="' + tn.d + '"></path>').join('');
    $('tlabels-g').innerHTML = TOWNS.map(tn => '<text class="tlabel" data-t="' + tn.i + '" x="' + tn.lx.toFixed(0) + '" y="' + tn.ly.toFixed(0) + '">' + tn.name + '</text>').join('');
    $('counties-g').querySelectorAll('path').forEach(p => countyEls[p.dataset.name] = p);
  }

  const townEls = [...$('towns-g').querySelectorAll('path')];
  const tlabelEls = [...$('tlabels-g').querySelectorAll('text')];
  const camsInTown = {};
  cams.forEach(c => camsInTown[c.t] = (camsInTown[c.t] || 0) + 1);
  // 縣市範圍（用攝影機與邊界算）
  const BOX = {};
  for (const name of Object.keys(countyEls)){ const b = countyEls[name].getBBox(); BOX[name] = {x:b.x, y:b.y, w:b.width, h:b.height}; }
  const ALL = {x:-40, y:120, w:2250, h:3900};
  // ===== 市區攝影機（各縣市政府）＋ 國道／省道清單的增減 =====
  // 資料是按「更新清單」時從交通部 TDX 平台抓下來，存在這支手機的瀏覽器裡；這裡在開頁時把它加進來
  const CITY_NAMES = {Taipei: '台北市', NewTaipei: '新北市', Taoyuan: '桃園市', Taichung: '台中市', Tainan: '台南市', Kaohsiung: '高雄市',
    Keelung: '基隆市', Hsinchu: '新竹市', HsinchuCounty: '新竹縣', MiaoliCounty: '苗栗縣', ChanghuaCounty: '彰化縣', NantouCounty: '南投縣',
    YunlinCounty: '雲林縣', ChiayiCounty: '嘉義縣', Chiayi: '嘉義市', PingtungCounty: '屏東縣', YilanCounty: '宜蘭縣', HualienCounty: '花蓮縣',
    TaitungCounty: '台東縣', KinmenCounty: '金門縣', PenghuCounty: '澎湖縣', LienchiangCounty: '連江縣'};
  const DYN = store.get('tw-cctv-dyn', null);
  const CTR = new Set();          // 只有市區攝影機用到的路名（徽章顯示「市區」）
  const DYN_INFO = {ct: 0, fwAdd: 0, fwDel: 0, prAdd: 0, prDel: 0};
  {
    const K1 = 4095 / 3.5, KX1 = K1 * Math.cos(23.7 * Math.PI / 180);
    const projXY = (lon, lat) => [(lon - 120) * KX1, (25.35 - lat) * K1];
    const normU = u => String(u).replace(/^https?:\/\//i, '').replace(/:443(?=\/)/, '').replace(/\/+$/, '').toLowerCase();
    const parseMile = s => { const m = String(s || '').match(/(\d+)\s*[Kk]\s*\+?\s*(\d*)/); return m ? +m[1] + (m[2] ? +('0.' + m[2].padStart(3, '0')) : 0) : null; };
    const roadIdx = (name, city) => { let k = META.R.indexOf(name); if (k < 0){ k = META.R.length; META.R.push(name); if (city) CTR.add(k); } return k; };
    // 找攝影機所在的縣市與鄉鎮（先用外框篩選，再精確判斷）
    const pt = svg.createSVGPoint();
    const locate = c => {
      pt.x = c.x; pt.y = c.y;
      for (const tn of TOWNS){ const b = tn.box; if (c.x < b.x || c.x > b.x + b.w || c.y < b.y || c.y > b.y + b.h) continue; if (townEls[tn.i].isPointInFill(pt)){ c.t = tn.i; c.c = tn.c; return; } }
    };
    const S = DYN && DYN.src ? DYN.src : {};
    // 國道（fw）、省道（hw）：用影像網址比對內建清單；對得上的比例夠高才套用增減，避免來源格式改變時誤刪
    for (const [code, kind] of [['fw', 'fw'], ['hw', 'pr']]){
      const d = S[code]; if (!d || !d.L || !d.L.length) continue;
      const base = cams.filter(c => c.kind === kind);
      const dset = new Set(d.L.map(r => normU(r[5])));
      const keep = new Set(base.filter(c => dset.has(normU(c.live))));
      if (keep.size < base.length * 0.7) continue;
      const bset = new Set(base.map(c => normU(c.live)));
      for (let i = cams.length - 1; i >= 0; i--) if (cams[i].kind === kind && !keep.has(cams[i])){ cams.splice(i, 1); DYN_INFO[kind + 'Del']++; }
      for (const r of d.L){
        if (bset.has(normU(r[5]))) continue;
        const [x, y] = projXY(r[3], r[4]);
        const c = {kind, r: roadIdx(r[1] || (kind === 'fw' ? '國道' : '省道'), false), dir: kind === 'fw' ? (r[2] || '') : '',
          km: parseMile(r[6]), stake: r[6] || '', sec: r[7] || '', live: r[5],
          snap: /\/abs2mjpg\/bmjpg/.test(r[5]) ? r[5].replace('/abs2mjpg/bmjpg', '/abs2mjpg/jpg') : null, key: code + '|' + r[0], x, y};
        locate(c); if (c.c == null) c.c = -1;
        cams.push(c); DYN_INFO[kind + 'Add']++;
      }
    }
    // 各縣市市區攝影機
    for (const code of Object.keys(CITY_NAMES)){
      const d = S[code]; if (!d || !d.L) continue;
      for (const r of d.L){
        const [x, y] = projXY(r[3], r[4]);
        const c = {kind: 'ct', r: roadIdx(r[1] || '市區道路', true), dir: r[2] || '', km: null, stake: '', sec: '市區路口', live: r[5], snap: null,
          key: 'ct|' + code + '|' + r[5], x, y, cname: CITY_NAMES[code]};
        locate(c); if (c.c == null) c.c = META.C.indexOf(CITY_NAMES[code]);
        cams.push(c); DYN_INFO.ct++;
      }
    }
    cams.forEach((c, i) => c.i = i);
    $('total').textContent = cams.length.toLocaleString('zh-TW');
  }


  // ===== 道路線：把同一條路、同一方向的攝影機依里程連起來 =====
  const ROADLINES = [], IC = [];
  {
    const groups = new Map();
    for (const c of cams){
      if (c.km == null) continue;
      const key = c.kind === 'fw' ? (c.dir ? c.r + '|' + c.dir : null) : 'p' + c.r;
      if (!key) continue;
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(c);
    }
    const icm = new Map();
    for (const list of groups.values()){
      list.sort((a, b) => a.km - b.km);
      let cur = [list[0]];
      const flush = () => { if (cur.length > 1){ const xs = cur.map(c => c.x), ys = cur.map(c => c.y); ROADLINES.push({r: cur[0].r, kind: cur[0].kind, pts: cur.map(c => [c.x, c.y]), box: [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)]}); } };
      for (let i = 1; i < list.length; i++){
        const a = list[i - 1], b = list[i];
        const dk = b.km - a.km, dist = Math.hypot(b.x - a.x, b.y - a.y);
        const ok = dk <= (a.kind === 'fw' ? 2.5 : 3) && dist < 40 && dist < (dk + 0.6) * 16;
        if (ok){ if (dist > 0.2) cur.push(b); }
        else { flush(); cur = [b]; }
        // 交流道：前後兩支攝影機的路段名稱交界處
        if (a.kind === 'fw' && a.sec && b.sec && a.sec !== b.sec && dk < 3){
          const A2 = a.sec.split('→'), B2 = b.sec.split('→');
          const common = A2.find(n => B2.includes(n));
          if (common && !common.includes('--')){
            const k = a.r + '|' + common, e = icm.get(k) || {name: common, r: a.r, x: 0, y: 0, n: 0};
            e.x += (a.x + b.x) / 2; e.y += (a.y + b.y) / 2; e.n++; icm.set(k, e);
          }
        }
      }
      flush();
    }
    for (const e of icm.values()) IC.push({name: e.name, r: e.r, x: e.x / e.n, y: e.y / e.n});
    const have = new Set(IC.map(ic => ic.r + '|' + ic.name)), byName = new Map();
    for (const c of cams){
      if (c.kind !== 'fw' || !c.sec) continue;
      for (const n of c.sec.split('→')){ if (n.includes('--') || have.has(c.r + '|' + n)) continue; const k = c.r + '|' + n; if (!byName.has(k)) byName.set(k, []); byName.get(k).push(c); }
    }
    for (const [k, list] of byName){
      let best = null;
      for (let a = 0; a < list.length; a++) for (let b = a + 1; b < list.length; b++){
        const A = list[a], B = list[b]; if (A.sec === B.sec) continue;
        const d = Math.hypot(A.x - B.x, A.y - B.y); if (!best || d < best[0]) best = [d, A, B];
      }
      if (best && best[0] < 60) IC.push({name: k.split('|')[1], r: best[1].r, x: (best[1].x + best[2].x) / 2, y: (best[1].y + best[2].y) / 2});
    }
  }

  const cv = $('detail'), g2 = cv.getContext('2d');
  function drawDetail(){
    const rect = svg.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const W = Math.max(1, Math.round(rect.width * dpr)), H = Math.max(1, Math.round(rect.height * dpr));
    if (cv.width !== W || cv.height !== H){ cv.width = W; cv.height = H; }
    g2.setTransform(1, 0, 0, 1, 0, 0);
    g2.clearRect(0, 0, W, H);
    const s = W / vb.w;
    const pxu = vb.w / Math.max(1, rect.width); // 每個螢幕像素等於幾個地圖單位
    const X = x => (x - vb.x) * s, Y = y => (y - vb.y) * s;
    const x0 = vb.x, y0 = vb.y, x1 = vb.x + vb.w, y1 = vb.y + vb.h;
    const out = b => b[2] < x0 || b[0] > x1 || b[3] < y0 || b[1] > y1;
    const css = getComputedStyle(document.documentElement);
    const col = n => css.getPropertyValue(n).trim();
    const INK = col('--ink'), MUTED = col('--muted'), LAND = col('--land'), FW = col('--fw'), PR = col('--pr'), CTC = col('--ct');
    const kcol = c => c.kind === 'fw' ? FW : c.kind === 'ct' ? CTC : PR;

    // 1. 村里界線（虛線）
    if (vb.w < 300){
      g2.beginPath();
      for (let i = 0; i < ARCS.length; i++){
        if (ARC_KIND[i] || out(ARC_BOX[i])) continue;
        const a = ARCS[i];
        g2.moveTo(X(a[0][0]), Y(a[0][1]));
        for (let k = 1; k < a.length; k++) g2.lineTo(X(a[k][0]), Y(a[k][1]));
      }
      g2.strokeStyle = col('--tline'); g2.lineWidth = dpr; g2.setLineDash([4 * dpr, 3 * dpr]); g2.stroke(); g2.setLineDash([]);
    }
    // 2. 道路（攝影機沿線）
    const lw = (vb.w < 100 ? 5 : vb.w < 300 ? 4 : 3) * dpr;
    g2.lineJoin = 'round'; g2.lineCap = 'round';
    for (const kind of (vb.w <= 900 ? ['pr', 'fw'] : [])){
      g2.beginPath();
      for (const rl of ROADLINES){
        if (rl.kind !== kind || out(rl.box)) continue;
        g2.moveTo(X(rl.pts[0][0]), Y(rl.pts[0][1]));
        for (let k = 1; k < rl.pts.length; k++) g2.lineTo(X(rl.pts[k][0]), Y(rl.pts[k][1]));
      }
      if (!state.layers[kind] && state.mode !== 'spot') continue; // （市區沒有道路線）
      g2.globalAlpha = state.mode === 'spot' ? 0.15 : 0.3; g2.strokeStyle = kind === 'fw' ? FW : PR; g2.lineWidth = lw; g2.stroke(); g2.globalAlpha = 1;
    }

    // ===== 攝影機點：太密的地方合併成數字泡泡，點泡泡就放大 =====
    DRAWN = [];
    const rpx = dotR();
    const pad = 20 * pxu;
    const inside = c => c.x > x0 - pad && c.x < x1 + pad && c.y > y0 - pad && c.y < y1 + pad;
    const on = [], dim = [];
    for (const c of cams){
      if (!inside(c)) continue;
      if (state.mode === 'spot' || !state.layers[c.kind]) continue; // 看景點時、或關掉的種類：地圖上完全不畫
      (mapShows(c) ? on : dim).push(c);
    }
    function dot(c, r, alpha){
      g2.globalAlpha = alpha == null ? 1 : alpha;
      g2.beginPath(); g2.arc(X(c.x), Y(c.y), r * dpr, 0, Math.PI * 2);
      g2.fillStyle = kcol(c); g2.fill();
      if (r >= 4){ g2.lineWidth = 1.5 * dpr; g2.strokeStyle = LAND; g2.stroke(); }
      g2.globalAlpha = 1;
    }
    // 被篩掉的攝影機只留淡淡的小點，讓人知道那裡還有
    for (const c of dim) dot(c, Math.min(2.2, rpx), 0.22);
    const interactive = vb.w <= 1300;
    const sorted = on.slice().sort((a, b) => (a.kind === 'fw') - (b.kind === 'fw'));
    if (!interactive || vb.w < CLUSTER_OFF){
      for (const c of sorted){ if (c.i === state.pick) continue; dot(c, rpx); if (interactive) DRAWN.push({x: c.x, y: c.y, r: rpx, cams: [c]}); }
    } else {
      const cell = 30 * pxu, m = new Map();
      for (const c of sorted){
        if (c.i === state.pick) continue;
        const k = Math.floor(c.x / cell) + ',' + Math.floor(c.y / cell);
        if (!m.has(k)) m.set(k, []);
        m.get(k).push(c);
      }
      let cl = [...m.values()].map(list => ({list, x: list.reduce((s, c) => s + c.x, 0) / list.length, y: list.reduce((s, c) => s + c.y, 0) / list.length}));
      // 相鄰格子太靠近的再合併一次，避免泡泡疊在一起
      for (let changed = true, guard = 0; changed && guard < 6; guard++){
        changed = false;
        for (let i = 0; i < cl.length; i++) for (let j = i + 1; j < cl.length; j++){
          const a = cl[i], b = cl[j];
          const ra = a.list.length > 1 ? 13 : rpx, rb = b.list.length > 1 ? 13 : rpx;
          if (Math.hypot(a.x - b.x, a.y - b.y) / pxu < ra + rb + 2){
            const n = a.list.length + b.list.length;
            a.x = (a.x * a.list.length + b.x * b.list.length) / n; a.y = (a.y * a.list.length + b.y * b.list.length) / n;
            a.list = a.list.concat(b.list); cl.splice(j, 1); j--; changed = true;
          }
        }
      }
      for (const k of cl){
        if (k.list.length === 1){ dot(k.list[0], rpx); DRAWN.push({x: k.x, y: k.y, r: rpx, cams: k.list}); continue; }
        const n = k.list.length, r = 10 + Math.min(8, Math.sqrt(n) * 1.6);
        const kn = {fw: 0, pr: 0, ct: 0}; k.list.forEach(c => kn[c.kind]++);
        const top = kn.fw >= kn.pr && kn.fw >= kn.ct ? FW : kn.ct > kn.pr ? CTC : PR;
        g2.beginPath(); g2.arc(X(k.x), Y(k.y), r * dpr, 0, Math.PI * 2);
        g2.fillStyle = top; g2.fill();
        g2.lineWidth = 2 * dpr; g2.strokeStyle = LAND; g2.stroke();
        g2.fillStyle = '#fff'; g2.font = '700 ' + (12 * dpr) + 'px ' + col('--font-num'); g2.textAlign = 'center'; g2.textBaseline = 'middle';
        g2.fillText(String(n), X(k.x), Y(k.y) + 0.5 * dpr); g2.textAlign = 'left';
        DRAWN.push({x: k.x, y: k.y, r, cams: k.list});
      }
    }
    // 景點直播：橘色方塊＋播放符號，任何縮放都能點
    const spotMode = state.mode === 'spot';
    const sr = spotMode ? (vb.w > 1300 ? 6 : 9) : (vb.w > 1300 ? 3.5 : vb.w > 450 ? 6 : 7.5);
    const SPC = '#e8590c';
    function spotMark(s, r, ring){
      const cx = X(s.x), cy = Y(s.y), h = r * dpr;
      g2.beginPath();
      if (g2.roundRect) g2.roundRect(cx - h, cy - h, h * 2, h * 2, h * 0.35); else g2.rect(cx - h, cy - h, h * 2, h * 2);
      g2.fillStyle = SPC; g2.fill(); g2.lineWidth = 1.5 * dpr; g2.strokeStyle = ring ? col('--ink') : LAND; g2.stroke();
      if (r >= 5.5){ g2.beginPath(); g2.moveTo(cx - h * 0.32, cy - h * 0.45); g2.lineTo(cx + h * 0.5, cy); g2.lineTo(cx - h * 0.32, cy + h * 0.45); g2.closePath(); g2.fillStyle = '#fff'; g2.fill(); }
    }
    for (const s of (spotMode ? SPOTS : [])){
      if (!inside(s) || s.i === state.spick) continue;
      spotMark(s, sr); DRAWN.push({x: s.x, y: s.y, r: sr, spot: s, cams: []});
    }
    if (state.spick != null && spotMode){ const s = SPOTS[state.spick]; spotMark(s, sr + 2, true); DRAWN.push({x: s.x, y: s.y, r: sr + 2, spot: s, cams: []}); }
    // 候選（同一位置好幾支）加紅框；選到的那支永遠單獨畫在最上面
    for (const i of state.cand){ const c = cams[i]; g2.beginPath(); g2.arc(X(c.x), Y(c.y), (rpx + 3) * dpr, 0, Math.PI * 2); g2.lineWidth = 2.5 * dpr; g2.strokeStyle = col('--live'); g2.stroke(); }
    if (state.pick != null){ const c = cams[state.pick]; dot(c, rpx + 1); if (interactive) DRAWN.push({x: c.x, y: c.y, r: rpx + 1, cams: [c]}); }

    if ($('tlabels-g').style.display !== 'none'){
      tlabelEls.forEach((e, k) => {
        if (e.style.display === 'none'){ e.style.visibility = ''; return; }
        const tn = TOWNS[k], cx = X(tn.lx), cy = Y(tn.ly), hw = tn.name.length * 6.5 * dpr, hh = 9 * dpr;
        const hit = DRAWN.some(d => { const r = (d.r + 2) * dpr, dx = Math.max(Math.abs(X(d.x) - cx) - hw, 0), dy = Math.max(Math.abs(Y(d.y) - cy) - hh, 0); return dx * dx + dy * dy < r * r; });
        e.style.visibility = hit && state.town !== k ? 'hidden' : '';
      });
    }
    // 文字：先放的優先，後面的若會重疊就不畫
    const boxes = [];
    const fits = (x, y, w, h) => { if (x < 0 || y < 0 || x + w > W || y + h > H) return false; for (const b of boxes) if (x < b[0] + b[2] && x + w > b[0] && y < b[1] + b[3] && y + h > b[1]) return false; boxes.push([x, y, w, h]); return true; };
    const FONT = n => (n * dpr) + 'px ' + col('--font-body');
    function text(str, x, y, size, color, weight, align){
      g2.font = (weight || 500) + ' ' + FONT(size);
      const w = g2.measureText(str).width, h = size * dpr * 1.25;
      const lx = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
      if (!fits(lx - 2 * dpr, y - h / 2, w + 4 * dpr, h)) return false;
      g2.textBaseline = 'middle'; g2.textAlign = 'left';
      g2.lineWidth = 3 * dpr; g2.strokeStyle = LAND; g2.lineJoin = 'round'; g2.strokeText(str, lx, y);
      g2.fillStyle = color; g2.fillText(str, lx, y);
      return true;
    }
    function pill(str, x, y, color){
      g2.font = '700 ' + FONT(11);
      const w = g2.measureText(str).width + 8 * dpr, h = 16 * dpr;
      if (!fits(x - w / 2, y - h / 2, w, h)) return false;
      g2.fillStyle = color; g2.beginPath();
      if (g2.roundRect) g2.roundRect(x - w / 2, y - h / 2, w, h, 4 * dpr); else g2.rect(x - w / 2, y - h / 2, w, h);
      g2.fill(); g2.fillStyle = '#fff'; g2.textAlign = 'center'; g2.textBaseline = 'middle'; g2.fillText(str, x, y + 0.5 * dpr); g2.textAlign = 'left';
      return true;
    }
    // 鄉鎮市區名稱已經畫在上層，先把它們的位置佔住
    if ($('tlabels-g').style.display !== 'none'){
      tlabelEls.forEach((e, k) => { if (e.style.display === 'none' || e.style.visibility === 'hidden') return; const tn = TOWNS[k]; const w = tn.name.length * 12 * dpr; boxes.push([X(tn.lx) - w / 2, Y(tn.ly) - 9 * dpr, w, 18 * dpr]); });
    }
    // 景點名稱（景點模式時較早顯示）
    if (spotMode && vb.w < 1300){
      const ord = SPOTS.slice().sort((a, b) => (b.i === state.spick) - (a.i === state.spick));
      for (const s of ord){
        if (s.x < x0 || s.x > x1 || s.y < y0 || s.y > y1) continue;
        const cx = X(s.x), cy = Y(s.y), off = (sr + 4) * dpr;
        text(s.name, cx + off, cy, 12, SPC, 700) || text(s.name, cx - off, cy, 12, SPC, 700, 'right') || text(s.name, cx, cy - off - 4 * dpr, 12, SPC, 700, 'center');
      }
    }
    // 3. 選到的攝影機與附近攝影機的標示（放大時）
    if (vb.w < CLUSTER_OFF){
      const vis = on.filter(c => c.x > x0 && c.x < x1 && c.y > y0 && c.y < y1);
      if (state.pick != null){ const i = vis.findIndex(c => c.i === state.pick); if (i > 0) vis.unshift(vis.splice(i, 1)[0]); }
      if (vis.length < 200){
        for (const c of vis){
          const b = roadBadge(META.R[c.r]).t;
          const str = (c.kind === 'ct' ? '' : b + ' ') + kmText(c).replace(' · ', ' ') + (dirText(c) ? ' ' + dirText(c) : '');
          const cx = X(c.x), cy = Y(c.y), off = 10 * dpr;
          const color = kcol(c);
          // 先試右邊，再試左邊、上面、下面
          text(str, cx + off, cy, 11.5, color, 700) || text(str, cx - off, cy, 11.5, color, 700, 'right') ||
            text(str, cx, cy - off - 3 * dpr, 11.5, color, 700, 'center') || text(str, cx, cy + off + 3 * dpr, 11.5, color, 700, 'center');
        }
      }
    }
    // 4. 交流道
    if (vb.w < 450){
      for (const ic of IC){
        if (ic.x < x0 || ic.x > x1 || ic.y < y0 || ic.y > y1) continue;
        const cx = X(ic.x), cy = Y(ic.y);
        if (text('◆ ' + ic.name, cx, cy, vb.w < 120 ? 12.5 : 11.5, FW, 700, 'center') === false) continue;
      }
    }
    // 5. 路名標籤（沿著道路每隔一段放一個）
    if (vb.w < 900){
      const gap = 260 * dpr;
      for (const rl of ROADLINES){
        if (out(rl.box)) continue;
        const name = roadBadge(META.R[rl.r]).t;
        let acc = gap * 0.5;
        for (let k = 1; k < rl.pts.length; k++){
          const ax = X(rl.pts[k - 1][0]), ay = Y(rl.pts[k - 1][1]), bx = X(rl.pts[k][0]), by = Y(rl.pts[k][1]);
          acc += Math.hypot(bx - ax, by - ay);
          if (acc >= gap && bx > 0 && by > 0 && bx < W && by < H){ if (pill(name, (ax + bx) / 2, (ay + by) / 2, rl.kind === 'fw' ? FW : PR)) acc = 0; }
        }
      }
    }
    // 6. 村里名稱
    if (vb.w < 150){
      const need = vb.w > 100 ? 7 : vb.w > 60 ? 5 : vb.w > 30 ? 3 : 0;
      for (const v of VILLS){
        if (v.lv < need || v.x < x0 || v.x > x1 || v.y < y0 || v.y > y1) continue;
        text(v.name, X(v.x), Y(v.y), 11, MUTED, 500, 'center');
      }
    }
  }

  // 地圖要顯示哪些攝影機：跟著下方選的道路、方向、搜尋、最愛一起變
  const CLUSTER_OFF = 70;  // 放大到這個程度以下就不再合併，每支都單獨顯示並標上里程
  let DRAWN = [];
  function dotR(){ return vb.w < 25 ? 7 : vb.w < CLUSTER_OFF ? 6 : vb.w < 150 ? 5.5 : vb.w < 1300 ? 5 : 2.6; }
  function mapShows(c){

  // 切換到另一支時，地圖跟著移過去（不改縮放，除非原本太遠）

    selectCam(c, false);
    const a = aspect(), w = Math.min(vb.w, 60), h = w * a;
    animateTo({x: c.x - w / 2, y: c.y - h * 0.35, w, h}, 280);
  }
  function closePick(){
    clearCand();
    if (state.spick != null){ state.spick = null; drawDetail(); }
    state.pick = null; $('pick').hidden = true; $('selring').setAttribute('hidden', '');
    const img = $('pick').querySelector('img'); if (img) img.removeAttribute('src');
    document.querySelectorAll('#grid .cam.on').forEach(e => e.classList.remove('on'));
    hint();
  }

  // ===== 選項列：太多時只先顯示幾行，按「顯示全部」展開；選到的那個永遠排在前面看得到 =====
  const expanded = {};
  function fitRow(id, rows){
    const el = $(id), btn = $(id + '-more');
    if (!el || el.hidden || !el.children.length){ if (btn) btn.hidden = true; return; }
    el.classList.remove('clip'); el.style.maxHeight = '';
    const rowH = Math.max(...[...el.children].slice(0, 6).map(e => e.offsetHeight)) + 6;
    const lim = rowH * rows - 6;
    if (el.scrollHeight <= lim + 4){ btn.hidden = true; return; }
    btn.hidden = false;
    const n = el.querySelectorAll('button').length;
    if (expanded[id]){ btn.textContent = '收合 ▴'; return; }
    // 收合時，把選到的那個移到最前面（「全部」之後）
    const on = el.querySelector('[aria-pressed="true"]');
    if (on && on.offsetTop - el.offsetTop >= lim - 2){ const anchor = el.children[0].getAttribute('aria-pressed') != null && /全部|全台/.test(el.children[0].textContent) ? el.children[0] : null; el.insertBefore(on, anchor ? anchor.nextSibling : el.firstChild); }
    el.classList.add('clip'); el.style.maxHeight = lim + 'px';
    btn.textContent = '顯示全部 ' + n + ' 個 ▾';
  }
  function fitRows(){ fitRow('counties', 3); fitRow('towns', 2); fitRow('roads', 2); }
  ['counties', 'towns', 'roads'].forEach(id => $(id + '-more').addEventListener('click', () => { expanded[id] = !expanded[id]; fitRows(); }));
  window.addEventListener('resize', () => { clearTimeout(fitRows.t); fitRows.t = setTimeout(fitRows, 150); });

  // ===== 鄉鎮市區快捷鈕（選了縣市才出現） =====
  function renderTownChips(){
    const el = $('towns');
    if (!state.county){ el.hidden = true; el.innerHTML = ''; return; }
    const list = TOWNS.filter(tn => tn.county === state.county)
      .sort((a, b) => (camsInTown[b.i] || 0) - (camsInTown[a.i] || 0) || a.name.localeCompare(b.name, 'zh-Hant'));
    el.hidden = false;
    el.innerHTML = '<button class="chip" type="button" data-t="" aria-pressed="' + (state.town == null) + '">' + esc(state.county) + '全部</button>' +
      list.map(tn => '<button class="chip' + (camsInTown[tn.i] ? '' : ' zero') + '" type="button" data-t="' + tn.i + '" aria-pressed="' + (state.town === tn.i) + '">' + esc(tn.name) + '<span class="n">' + (camsInTown[tn.i] || 0) + '</span></button>').join('');
    fitRow('towns', 2);
  }
  $('towns').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    closePick();
    if (b.dataset.t === '') selectCounty(state.county); else selectTown(+b.dataset.t, true);
  });

  // ===== 縣市快捷鈕 =====
  function renderCountyChips(){
    $('counties').innerHTML = '<button class="chip" type="button" data-c="" aria-pressed="' + (!state.county) + '">全台灣</button>' +
      ORDER.filter(n => BOX[n]).map(n => '<button class="chip" type="button" data-c="' + n + '" aria-pressed="' + (state.county === n) + '">' + n + '</button>').join('');
    fitRow('counties', 3);
  }
  $('counties').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    closePick();
    if (state.q){ state.q = ''; $('q').value = ''; }
    if (state.mode === 'fav') setMode('map');
    state.county = b.dataset.c || null; state.town = null; state.road = null; state.dir = '';
    markCounty();
    animateTo(state.county ? fit(BOX[state.county]) : fit(ALL, 0));
  });

  // ===== 清單 =====
  let lastBase = [], lastList = [], lastBaseSet = new Set();
  function inView(c){ return c.x >= vb.x && c.x <= vb.x + vb.w && c.y >= vb.y && c.y <= vb.y + vb.h; }
  function baseList(){
    const l = baseList0();
    return state.mode === 'fav' ? l : l.filter(c => state.layers[c.kind]);
  }
  function baseList0(){
    if (state.q){
      const q = state.q.replace(/\s+/g,'').replace(/臺/g,'台').toLowerCase();
      const qn = q.replace(/^國道?(\d)/,'國道$1');
      return cams.filter(c => { const n = META.R[c.r]; const hay = (n + (c.sec || '') + (c.stake || '') + META.C[c.c] + townName(c) + roadBadge(n).t).toLowerCase(); return hay.includes(q) || hay.includes(qn); });
    }
    if (state.near) return state.near.list;
    if (state.mode === 'fav') return cams.filter(c => favs.has(c.key));
    if (state.town != null) return cams.filter(c => c.t === state.town);
    return cams.filter(c => inView(c) && (!state.county || META.C[c.c] === state.county));
  }
  let listTimer;
  function scheduleList(){ clearTimeout(listTimer); listTimer = setTimeout(renderList, 160); }

  function renderList(){
    syncLayers();
    if (state.mode === 'spot'){ renderSpots(); return; }
    $('spotbtn').setAttribute('aria-pressed', 'false');
    const base = baseList();
    lastBase = base;
    lastBaseSet = new Set(base.map(c => c.i));

    // 這一區有哪些道路
    const cnt = {};
    base.forEach(c => cnt[c.r] = (cnt[c.r] || 0) + 1);
    const rs = Object.keys(cnt).map(Number).sort((a,b) => {
      const fa = roadBadge(META.R[a]).cls === 'fw', fb = roadBadge(META.R[b]).cls === 'fw';
      if (fa !== fb) return fa ? -1 : 1;
      if (fa) return roadNo(META.R[a]) - roadNo(META.R[b]);
      return cnt[b] - cnt[a];
    });
    if (state.road != null && !cnt[state.road]) state.road = null;
    $('roads').innerHTML = rs.length > 1 ? '<button class="road all" type="button" data-r="" aria-pressed="' + (state.road == null) + '">全部 ' + base.length + '</button>' +
      rs.map(r => '<button class="road" type="button" data-r="' + r + '" aria-pressed="' + (state.road === r) + '">' + badgeHTML(r) + '<span>' + esc(META.R[r]) + '</span><span class="n">' + cnt[r] + '</span></button>').join('') : '';
    fitRow('roads', 2);

    let list = state.road != null ? base.filter(c => c.r === state.road) : base;
    // 方向
    const ds = [...new Set(list.filter(c => c.dir && c.kind === 'fw').map(c => c.dir))];
    if (ds.length >= 2 && !state.q && state.mode !== 'fav'){
      if (state.dir && !ds.includes(state.dir)) state.dir = '';
      $('dirs').innerHTML = '<span class="lbl">國道方向</span><button class="chip" type="button" data-d="" aria-pressed="' + (!state.dir) + '">雙向</button>' +
        ['S','N','E','W'].filter(d => ds.includes(d)).map(d => '<button class="chip" type="button" data-d="' + d + '" aria-pressed="' + (state.dir === d) + '">' + DIRS[d] + '</button>').join('');
      if (state.dir) list = list.filter(c => c.kind !== 'fw' || !c.dir || c.dir === state.dir);
    } else { $('dirs').innerHTML = ''; state.dir = ''; }

    drawDetail(); // 地圖跟著篩選更新
    // 排序：先國道後省道，同一條路照里程
    if (state.near) list = list.slice().sort((a, b) => a._d - b._d); // 附近模式：由近到遠
    else list = list.slice().sort((a,b) => {
      const fa = a.kind === 'fw', fb = b.kind === 'fw';
      if (fa !== fb) return fa ? -1 : 1;
      return (roadNo(META.R[a.r]) - roadNo(META.R[b.r])) || (a.r - b.r) || ((a.km ?? 1e9) - (b.km ?? 1e9));
    });
    lastList = list;

    const favSpots0 = state.mode === 'fav' && !state.q ? SPOTS.filter(s => favs.has('spot:' + s.uid)) : [];
    const t = $('title');
    $('nearx').hidden = !state.near;
    if (state.near) t.textContent = '「' + state.near.name + '」附近 · ' + list.length + ' 支（由近到遠）';
    else if (state.q) t.textContent = '搜尋「' + state.q + '」· ' + list.length + ' 支';
    else if (state.mode === 'fav') t.textContent = '★ 我的最愛 · ' + (list.length + favSpots0.length) + ' 個';
    else if (state.town != null) t.textContent = state.county + ' ' + TOWNS[state.town].name + ' · ' + list.length + ' 支攝影機';
    else t.textContent = state.county ? state.county + ' · ' + list.length + ' 支攝影機' : '地圖範圍內 ' + list.length + ' 支';
    $('favn').textContent = favs.size;
    $('favbtn').setAttribute('aria-pressed', state.mode === 'fav');

    const grid = $('grid');
    const favSpots = state.mode === 'fav' && !state.q ? SPOTS.filter(s => favs.has('spot:' + s.uid)) : [];
    renderNearBox(list);
    if (!list.length && !favSpots.length){
      grid.innerHTML = '<div class="empty">' + (state.mode === 'fav' && !state.q
        ? '還沒有最愛的攝影機。<br>點任何攝影機旁的 ☆，下次打開就能一次看完你常走的路段。'
        : state.q ? '找不到符合的道路或交流道，換個關鍵字試試，例如「國道3號」或「台61」。'
        : state.town != null ? '這個區域沒有國道或省道攝影機，換旁邊的區域看看。' : '這個範圍沒有攝影機，把地圖拖到有點的地方，或按「全台」重新選。') + '</div>';
      $('more').hidden = true; return;
    }
    grid.innerHTML = spotHint() + list.slice(0, limit).map(cardHTML).join('') + favSpots.map(spotCard).join('');
    $('more').hidden = list.length <= limit;
    $('more').textContent = '顯示更多（還有 ' + (list.length - limit) + ' 支）';
    attachImages();
  }

  function cardHTML(c){
    const isFav = favs.has(c.key);
    const shot = canEmbed ? '<button class="shot" type="button" data-view="' + c.i + '" aria-label="放大看即時影像"><img data-i="' + c.i + '" alt="' + esc(META.R[c.r] + ' ' + kmText(c)) + ' 即時畫面"><span class="ph">載入中…</span><span class="tag"><span class="dot"></span><span class="t">即時</span></span></button>' : '';
    return '<article class="cam' + (state.pick === c.i ? ' on' : '') + '" data-i="' + c.i + '">' + shot +
      '<div class="meta">' + badgeHTML(c.r) +
      '<div class="txt"><div class="km">' + esc(kmText(c)) + (dirText(c) ? '<small>' + dirText(c) + '</small>' : '') + '</div><div class="secline">' + (state.near ? '<span class="dist">' + distText(c._d) + '</span>' : '') + esc(place(c) + ' · ' + (c.sec || META.R[c.r])) + '</div></div>' +
      favBtn('star', c.i, isFav, false) + '</div>' +
      '<div class="btns">' + (canEmbed ? '' : '<a class="open" href="' + esc(c.live) + '" target="_blank" rel="noopener"><span class="dot"></span>看即時影像</a>') +
      '<button class="locate" type="button" data-loc="' + c.i + '">在地圖上看</button></div>' +
      '</article>';
  }

  // ===== 縮圖：只載入看得到的格子 =====
  let io = null;
  const SNAP_EVERY = 15000;
  function attachImages(){
    if (!canEmbed) return;
    if (io) io.disconnect();
    io = new IntersectionObserver(entries => {
      for (const e of entries){ const img = e.target, c = cams[+img.dataset.i]; if (e.isIntersecting) startImg(img, c); else stopImg(img); }
    }, {rootMargin:'200px'});
    document.querySelectorAll('#grid img[data-i], #nearbox img[data-i]').forEach(img => io.observe(img));
  }
  function startImg(img, c){
    const ph = img.parentElement.querySelector('.ph');
    img.onload = () => { if (ph) ph.hidden = true; const t = img.parentElement.querySelector('.t'); if (t) t.textContent = c.snap ? new Date().toLocaleTimeString('zh-TW', {hour12:false}) : '即時'; };
    img.onerror = () => {
      // 市區攝影機若不是圖片，而是網頁播放器：改成「點開看」
      if (c.kind === 'ct'){ c.page = true; img.removeAttribute('src'); if (ph){ ph.hidden = false; ph.textContent = (NOFRAME.test(c.live) ? '▶ 點開看（新分頁）' : '▶ 點開看即時影像'); } return; }
      if (ph){ ph.hidden = false; ph.textContent = '這支攝影機暫時沒有畫面'; }
    };
    if (c.page){ if (ph){ ph.hidden = false; ph.textContent = (NOFRAME.test(c.live) ? '▶ 點開看（新分頁）' : '▶ 點開看即時影像'); } return; }
    if (c.snap){ const load = () => { img.src = c.snap + '&t=' + Date.now(); }; load(); clearInterval(img._t); img._t = setInterval(load, SNAP_EVERY); }
    else if (!img.src) img.src = c.live;
  }
  function stopImg(img){ clearInterval(img._t); if (img.src){ img.removeAttribute('src'); const ph = img.parentElement.querySelector('.ph'); if (ph){ ph.hidden = false; ph.textContent = '載入中…'; } } }

  // ===== 放大檢視 =====
  let vlist = [], vi = -1;
  // 這些網站的播放器不允許被別的網頁嵌入，點了直接開新分頁
  const NOFRAME = /^https?:\/\/atis\.ntpc\.gov\.tw\//i;
  function openViewer(idx){
    if (NOFRAME.test(cams[idx].live)){ window.open(cams[idx].live, '_blank', 'noopener'); return; }
    vlist = lastList.some(c => c.i === idx) ? lastList : [cams[idx]];
    vi = vlist.findIndex(c => c.i === idx);
    showViewer(); $('viewer').hidden = false; $('vclose').focus();
  }
  function showViewer(){
    const c = vlist[vi];
    const vimg = $('vimg'), vf = $('vframe');
    const asPage = () => { vimg.hidden = true; vimg.removeAttribute('src'); vf.hidden = false; vf.src = c.live; };
    vf.hidden = true; vf.src = 'about:blank'; vimg.hidden = false;
    vimg.onerror = () => { if (c.kind === 'ct'){ c.page = true; asPage(); } };
    if (c.page) asPage(); else vimg.src = c.live;
    vimg.alt = META.R[c.r] + ' ' + kmText(c) + ' 即時影像';
    $('vbadge').innerHTML = badgeHTML(c.r, true);
    $('vkm').innerHTML = esc(kmText(c)) + (dirText(c) ? '<small>' + dirText(c) + '</small>' : '');
    $('vsec').textContent = place(c) + ' · ' + (c.sec || META.R[c.r]);
    $('vopen').href = c.live;
    $('vprev').disabled = vi <= 0; $('vnext').disabled = vi >= vlist.length - 1;
  }
  function closeViewer(){ $('viewer').hidden = true; $('vimg').removeAttribute('src'); $('vframe').src = 'about:blank'; $('vframe').hidden = true; }
  $('vprev').onclick = () => { if (vi > 0){ vi--; showViewer(); } };
  $('vnext').onclick = () => { if (vi < vlist.length - 1){ vi++; showViewer(); } };
  $('vclose').onclick = closeViewer;
  $('viewer').addEventListener('click', e => { if (e.target.id === 'viewer') closeViewer(); });
  document.addEventListener('keydown', e => {
    // 資訊卡開著時，鍵盤左右鍵也能沿路切換
    if ($('viewer').hidden && !$('pick').hidden && !/INPUT|TEXTAREA/.test((document.activeElement || {}).tagName || '')){
      const b = e.key === 'ArrowLeft' ? $('pick').querySelector('.navb[data-nav]:first-child') : e.key === 'ArrowRight' ? $('pick').querySelector('.navb:last-child[data-nav]') : null;
      if (b){ e.preventDefault(); b.click(); }
      return;
    }
    if ($('viewer').hidden) return;
    if (e.key === 'Escape') closeViewer();
    if (e.key === 'ArrowLeft') $('vprev').click();
    if (e.key === 'ArrowRight') $('vnext').click();
  });

  // ===== 其他互動 =====
  // 最愛按鈕：long＝地圖小卡上的長版文字
  function favBtn(kind, i, on, long){
    return '<button class="star favb" type="button" data-' + kind + '="' + i + '" data-long="' + (long ? 1 : 0) + '" aria-pressed="' + on + '">' + favText(on, long) + '</button>';
  }
  function favText(on, long){ return on ? (long ? '★ 已加入最愛' : '★ 已收藏') : (long ? '☆ 加入最愛' : '☆ 最愛'); }
  function setFavKey(key, sel){
    if (favs.has(key)) favs.delete(key); else favs.add(key);
    store.set('tw-cctv-favs', [...favs]);
    const on = favs.has(key);
    document.querySelectorAll(sel).forEach(s => { s.setAttribute('aria-pressed', on); s.textContent = favText(on, s.dataset.long === '1'); });
    $('favn').textContent = favs.size;
    if (state.mode === 'fav') scheduleList();
  }
  function toggleFav(i){ setFavKey(cams[i].key, '[data-star="' + i + '"]'); }
  document.addEventListener('click', e => {
    const s = e.target.closest('[data-star]'); if (s){ toggleFav(+s.dataset.star); return; }
    const ss = e.target.closest('[data-sstar]'); if (ss){ const sp = SPOTS[+ss.dataset.sstar]; setFavKey('spot:' + sp.uid, '[data-sstar="' + sp.i + '"]'); return; }
    const v = e.target.closest('[data-view]'); if (v){ openViewer(+v.dataset.view); return; }
    const ch = e.target.closest('[data-choose]'); if (ch){ selectCam(cams[+ch.dataset.choose], false); return; }
    const nv = e.target.closest('[data-nav]'); if (nv){ focusCam(cams[+nv.dataset.nav]); return; }
    const l = e.target.closest('[data-loc]');
    if (l){
      const c = cams[+l.dataset.loc];
      clearCounty(); selectCam(c, true);
      if (window.matchMedia('(max-width: 899px)').matches) $('mapbox').scrollIntoView({behavior:'smooth', block:'start'});
    }
  });
  $('roads').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; state.road = b.dataset.r === '' ? null : +b.dataset.r; limit = 60; renderList(); });
  $('dirs').addEventListener('click', e => { const b = e.target.closest('button[data-d]'); if (!b) return; state.dir = b.dataset.d; limit = 60; renderList(); });
  $('more').onclick = () => { limit += 60; renderList(); };
  function setMode(m){ state.mode = m; state.road = null; state.dir = ''; limit = 60; renderList(); }
  $('favbtn').onclick = () => {
    clearNear(true);
    if (state.q){ state.q = ''; $('q').value = ''; }
    closePick();
    setMode(state.mode === 'fav' ? 'map' : 'fav');
    if (state.mode === 'fav' && lastBase.length){
      // 地圖移到最愛攝影機所在的範圍
      const xs = lastBase.map(c => c.x), ys = lastBase.map(c => c.y);
      const x0 = Math.min(...xs), y0 = Math.min(...ys);
      animateTo(fit({x:x0, y:y0, w:Math.max(150, Math.max(...xs) - x0), h:Math.max(150, Math.max(...ys) - y0)}, 0.2));
    }
  };
  // ===== 地名搜尋：打景點、車站、鄉鎮、村里、交流道或道路，選了就看附近的攝影機 =====
  // 經緯度換成地圖座標（和底圖同一套投影）
  const K0 = 4095 / 3.5, KX0 = K0 * Math.cos(23.7 * Math.PI / 180);
  const proj = (lon, lat) => [(lon - 120) * KX0, (25.35 - lat) * K0];
  const UNIT_KM = 111.32 / K0;            // 地圖 1 單位約等於幾公里
  const kmToU = km => km / UNIT_KM;
  function distText(d){ const km = d * UNIT_KM; return km < 1 ? Math.max(50, Math.round(km * 1000 / 50) * 50) + ' 公尺' : km.toFixed(km < 10 ? 1 : 0) + ' 公里'; }
  const norm = s => String(s).replace(/臺/g, '台').replace(/[\s　]+/g, '').toLowerCase();

  // 建立搜尋用的地點清單
  const PLACES = [];
  $('lmk').textContent.trim().split('\n').forEach(line => {
    const [names, lat, lon] = line.split(',');
    const al = names.split('|'), [x, y] = proj(+lon, +lat);
    PLACES.push({type: 'lm', name: al[0], alt: al.slice(1), x, y});
  });
  COUNTIES.forEach(cn => PLACES.push({type: 'county', name: cn.name, alt: [], x: cn.lx, y: cn.ly, box: BOX[cn.name]}));
  TOWNS.forEach(tn => PLACES.push({type: 'town', name: tn.name, alt: tn.name.length > 2 ? [tn.name.slice(0, -1)] : [], sub: tn.county, x: tn.lx, y: tn.ly, t: tn.i}));
  const icSeen = new Set();
  IC.forEach(ic => { if (icSeen.has(ic.name)) return; icSeen.add(ic.name);
    const full = /交流道|服務區|休息站|轉接|系統|端$|隧道|收費站/.test(ic.name) ? ic.name : ic.name + '交流道';
    PLACES.push({type: 'ic', name: full, alt: [full.replace(/交流道$/, '')], sub: META.R[ic.r], x: ic.x, y: ic.y}); });
  VILLS.forEach(v => PLACES.push({type: 'vill', name: v.name, alt: [], sub: TOWNS[v.t] ? TOWNS[v.t].county + TOWNS[v.t].name : '', x: v.x, y: v.y}));
  // 地標、交流道補上所在縣市區，方便分辨同名地點
  PLACES.forEach(p => { p.n = norm(p.name); p.an = p.alt.map(norm); if (!p.sub && p.type !== 'county'){ const t = townAt(p.x, p.y); if (t != null) p.sub = TOWNS[t].county + TOWNS[t].name; } });
  const TYPE_RANK = {lm: 0, county: 1, town: 1, ic: 2, vill: 4};
  const TYPE_ICON = {lm: ['lm', '景'], county: ['ar', '縣'], town: ['ar', '區'], ic: ['ic2', '◆'], vill: ['', '里'], road: ['rd', '路'], web: ['web', '網'], me: ['lm', '📍']};

    setMode(state.mode === 'spot' ? 'map' : 'spot');
  };

  // ===== 搜尋地點後：最上面直接列出最近 4 支攝影機的即時畫面 =====
  function renderNearBox(list){
    const box = $('nearbox');
    if (!state.near || state.mode !== 'map' || state.q || !list.length){ box.hidden = true; box.innerHTML = ''; return; }
    const top = list.slice(0, 4);
    const tile = c => {
      const label = '<span class="nbl">' + esc((c.kind === 'ct' ? '市區 ' : roadBadge(META.R[c.r]).t + ' ') + kmText(c) + (dirText(c) ? ' ' + dirText(c) : '')) +
        '<small>' + distText(c._d) + ' · ' + esc(townName(c)) + '</small></span>';
      // 能嵌入畫面時顯示每 15 秒更新的縮圖；不能嵌入（例如 claude.ai）時點了開新分頁看
      return canEmbed
        ? '<button class="nbt" type="button" data-view="' + c.i + '" aria-label="放大看即時影像"><img data-i="' + c.i + '" alt=""><span class="ph">載入中…</span>' + label + '</button>'
        : '<a class="nbt" href="' + esc(c.live) + '" target="_blank" rel="noopener"><span class="ph">▶ 點開看即時影像</span>' + label + '</a>';
    };
    box.innerHTML = '<div class="nbhead"><b>📍 ' + esc(state.near.name) + ' 附近路況</b><span>最近的 ' + top.length + ' 支攝影機' + (canEmbed ? '，畫面每 15 秒自動更新' : '') + '</span></div>' +
      '<div class="nbgrid">' + top.map(tile).join('') + '</div>' +
      '<div class="nbacts"><button type="button" data-nbmap>看地圖位置</button><button class="pri" type="button" data-nball>看全部 ' + list.length + ' 支 ↓</button></div>';
    box.hidden = false;
  }
  document.addEventListener('click', e => {
    if (e.target.closest('[data-nbmap]')) $('mapbox').scrollIntoView({behavior: 'smooth', block: 'start'});
    if (e.target.closest('[data-nball]')) $('title').scrollIntoView({behavior: 'smooth', block: 'start'});
  });

  // ===== 地圖顯示開關 =====
  function syncLayers(){
    const sp = state.mode === 'spot';
    document.querySelectorAll('.lyr').forEach(b => {
      const k = b.dataset.ly, on = k === 'spot' ? sp : !sp && state.layers[k];
      b.setAttribute('aria-pressed', on); b.querySelector('.ck').textContent = on ? '✓' : '';
    });
  }
  $('legend').addEventListener('click', e => {
    const b = e.target.closest('.lyr'); if (!b) return;
    const k = b.dataset.ly;
    closePick();
    if (k === 'spot'){ setMode(state.mode === 'spot' ? 'map' : 'spot'); return; }
    if (state.mode === 'spot'){
      // 從景點切回路況：只開按的那一種
      state.layers = {fw: k === 'fw', pr: k === 'pr', ct: k === 'ct'};
      store.set('tw-cctv-layers', state.layers);
      setMode('map'); return;
    }
    state.layers[k] = !state.layers[k];
    if (!state.layers.fw && !state.layers.pr && !state.layers.ct) state.layers[k] = true; // 至少留一種
    store.set('tw-cctv-layers', state.layers);
    limit = 60; renderList();
  });

  // ===== 「更新清單」：直接向交通部 TDX 平台抓最新的國道、省道、各縣市市區攝影機 =====
  // 不用金鑰的查詢，每個網路每天大約 50 次；更新一次全部約 24 次，所以平常一天按一兩次就夠
  const TDX = 'https://tdx.transportdata.tw/api/basic/v2/Road/Traffic/CCTV/';
  function fmtTime(iso){ const d = new Date(iso); return isNaN(d) ? '' : (d.getMonth() + 1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
  let toastT;
  function toast(msg, ms){ const el = $('toast'); el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, ms || 9000); }
  $('toast').onclick = () => $('toast').hidden = true;
  function showUpdInfo(){
    const has = DYN && DYN.src && Object.keys(CITY_NAMES).some(k => DYN.src[k]);
    $('updt').textContent = has ? '清單更新於 ' + fmtTime(DYN.t) : '市區攝影機還沒載入';
    $('upd').textContent = has ? '⟳ 更新清單' : '⟳ 載入市區攝影機';
    $('upd').classList.toggle('first', !has);
  }
  async function updateList(){
    const btn = $('upd'); if (btn.disabled) return;
    btn.disabled = true; $('toast').hidden = true;
    const codes = Object.keys(CITY_NAMES).concat(['fw', 'hw']);
    const old = DYN && DYN.src ? DYN.src : {};
    const src = Object.assign({}, old);
    const sleep = ms => new Promise(r => setTimeout(r, ms));
    let ok = 0, quota = false, failed = 0, offline = false;
    for (let k = 0; k < codes.length; k++){
      const code = codes[k];
      btn.textContent = '更新中 ' + (k + 1) + '/' + codes.length + '…';
      const url = TDX + (code === 'fw' ? 'Freeway' : code === 'hw' ? 'Highway' : 'City/' + code) + '?$format=JSON';
      let res = null;
      for (let t = 0; t < 3; t++){
        try {
          const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 25000);
          const r = await fetch(url, {signal: ctl.signal}); clearTimeout(to);
          if (r.status === 429){ if (t < 2){ await sleep(3000 * (t + 1)); continue; } quota = true; break; }
          if (!r.ok) break;
          res = await r.json(); break;
        } catch(e){ if (k === 0) offline = true; break; }
      }
      if (quota || offline) break;
      if (res && Array.isArray(res.CCTVs)){
        const L = [];
        for (const x of res.CCTVs){
          const u = x.VideoStreamURL || x.VideoImageURL || '';
          if (!/^https?:/.test(u) || !x.PositionLat || !x.PositionLon) continue;
          const sec = x.RoadSection && x.RoadSection.Start ? x.RoadSection.Start + '→' + (x.RoadSection.End || '') : '';
          L.push([x.CCTVID || '', x.RoadName || '', x.RoadDirection || '', +(+x.PositionLon).toFixed(6), +(+x.PositionLat).toFixed(6), u, x.LocationMile || '', sec]);
        }
        src[code] = {t: new Date().toISOString(), L}; ok++;
      } else failed++;
      await sleep(1100); // 放慢一點，避免被平台判定呼叫太頻繁
    }
    const reset = () => { btn.disabled = false; showUpdInfo(); };
    if (!ok){
      reset();
      toast(quota ? '今天這個網路的免費查詢次數已用完，明天再按一次，或換個網路（例如手機行動網路）。'
                  : '連不到交通部資料平台。請用網站版、在台灣的網路下再按一次。');
      return;
    }
    // 算出新增、減少幾支（第一次載入只報市區數量）
    const keysOf = s => { const set = new Set(); for (const [code, d] of Object.entries(s)) if (d && d.L) for (const r of d.L) set.add(code + '|' + r[5]); return set; };
    const first = !Object.keys(CITY_NAMES).some(k => old[k]);
    const a = keysOf(old), b = keysOf(src);
    let add = 0, del = 0; for (const k of b) if (!a.has(k)) add++; for (const k of a) if (!b.has(k)) del++;
    const cityN = Object.keys(CITY_NAMES).reduce((n, k) => n + (src[k] ? src[k].L.length : 0), 0);
    let msg = first ? '已載入各縣市市區攝影機 ' + cityN.toLocaleString('zh-TW') + ' 支' : add || del ? '清單已更新：新增 ' + add + ' 支、減少 ' + del + ' 支' : '清單已是最新，沒有新增或減少';
    if (quota || failed){
      // 有些來源沒抓到：老實說只更新了幾個
      const part = '這次只更新到 ' + ok + '/' + codes.length + ' 個來源，其餘沿用上次的資料' + (quota ? '；今天這個網路的免費查詢次數已用完，明天再按一次即可' : '');
      msg = first ? msg + '（' + part + '）' : add || del ? msg + '（' + part + '）' : part + '。';
    }
    try { localStorage.setItem('tw-cctv-dyn', JSON.stringify({v: 1, t: new Date().toISOString(), src})); }
    catch(e){ reset(); toast('手機的瀏覽器儲存空間不足，沒辦法存下最新清單。'); return; }
    if (!first && !add && !del){ DYN && (DYN.t = new Date().toISOString()); reset(); toast(msg); return; }
    try { sessionStorage.setItem('tw-cctv-msg', msg); } catch(e){}
    location.reload(); // 重新開頁，用新清單重建地圖與清單
  }
  $('upd').onclick = updateList;
  showUpdInfo();
  try { const m = sessionStorage.getItem('tw-cctv-msg'); if (m){ sessionStorage.removeItem('tw-cctv-msg'); setTimeout(() => toast(m), 600); } } catch(e){}

  // ===== 偵測這個環境能不能直接顯示畫面 =====
  function setEmbed(ok){
    if (canEmbed === ok) return;
    canEmbed = ok;
    const note = $('note');
    if (!ok){ note.hidden = false; note.textContent = '這個環境不允許直接嵌入政府攝影機畫面，點「看即時影像」會在新分頁播放即時串流。'; }
    else note.hidden = true;
    renderList();
    if (state.pick != null) selectCam(cams[state.pick], false);
    if (state.spick != null) selectSpot(SPOTS[state.spick], false);
  }

  // ===== 開始 =====
  renderCountyChips();
  const saved = store.get('tw-cctv-vb', null);
  vb = saved && saved.w ? saved : fit(ALL, 0);
  resize();
  renderList();
  const probe = new Image();
  const to = setTimeout(() => setEmbed(false), 8000);
  probe.onload = () => { clearTimeout(to); setEmbed(true); };
  probe.onerror = () => { clearTimeout(to); setEmbed(false); };
  probe.src = 'https://cctvn.freeway.gov.tw/abs2mjpg/jpg?camera=10000&t=' + Date.now();
})();
</script>
</body></html>
