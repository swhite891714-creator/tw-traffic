<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>庫存查詢</title>
<meta name="theme-color" content="#0f6e5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="庫存查詢">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 唯讀公開頁：上方固定區（標題、更新時間、「庫存／客戶寄庫」分頁、篩選），品牌與類型下拉選單，下方依「品牌 · 類型」分組的商品清單；沒有任何編輯功能 */
:root{
  --bg:#f2f5f4; --surface:#ffffff; --fg:#14211d; --muted:#596a64; --line:#d9e1de;
  --accent:#0f6e5c; --danger:#c0362c; --danger-bg:#fde8e6; --warn:#9a4b00; --warn-bg:#fff0de;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1513; --surface:#16201d; --fg:#e4ece9; --muted:#93a59f; --line:#283632;
  --accent:#4fc4a6; --danger:#ff7b6f; --danger-bg:#3a1714; --warn:#ffb065; --warn-bg:#3a2612; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:17px;line-height:1.5;padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-left,0px)) 12px;display:grid;gap:10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-size:20px;margin:0}
.role{border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700;color:var(--accent);border:1px solid var(--accent)}
.status{font-size:14px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stat{display:grid;min-width:0;text-align:left;border:1px solid transparent;background:none;border-radius:10px;padding:4px 8px;font:inherit;color:inherit;cursor:pointer}
.stat b{font-family:var(--mono);font-size:21px;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted);letter-spacing:.04em}
.stat.on{border-color:var(--fg);background:var(--bg)}
.stat.zero b{color:var(--danger)}.stat.low b{color:var(--warn)}
input,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.filters{display:grid;grid-template-columns:1fr auto;gap:8px}
.filters select{width:auto;max-width:44vw}
/* 篩選區：搜尋框一整列，下面「品牌｜類型」兩個下拉選單並排 */
.fsel{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fsel select{width:100%;min-width:0;text-overflow:ellipsis}
.fsel select.on{border-color:var(--accent);color:var(--accent);font-weight:700}
.finfo{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.finfo button{border:0;background:none;color:var(--accent);font:inherit;font-weight:700;cursor:pointer;padding:0}
/* 分頁：庫存／客戶寄庫 */
.tabs{display:flex;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:0 max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line)}
.tab{flex:1;border:0;border-bottom:3px solid transparent;background:none;color:var(--muted);font:inherit;font-size:16px;font-weight:700;padding:8px 4px 7px;cursor:pointer}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tab small{font-weight:400;font-size:13px;margin-left:4px}
.ctl{display:grid;gap:10px}
.cqty{display:block;font-size:12px;color:var(--warn);font-weight:700;font-family:var(--sans)}
/* 庫存列上的「寄庫 N ›」：點了跳到客戶寄庫，只看這個商品 */
button.cqty{margin:3px 0 0 auto;border:1px solid var(--warn);background:var(--warn-bg);border-radius:6px;padding:1px 6px;cursor:pointer;white-space:nowrap}
.row.hascons{cursor:pointer}
.onlyitem{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1.5px solid var(--warn);background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:15px;font-weight:700}
.onlyitem span{min-width:0;overflow-wrap:anywhere}
.onlyitem button{flex:0 0 auto;border:0;background:none;color:inherit;font:inherit;font-weight:700;cursor:pointer;text-decoration:underline}
#consList .row.hl{background:var(--warn-bg);box-shadow:inset 4px 0 0 var(--warn);padding-left:10px}
#consList .row.hl .model{color:var(--warn)}
.cgrp{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;padding:18px 4px 6px;border-bottom:2px solid var(--fg);font-weight:700;font-size:17px}
.cgrp small{font-size:13px;font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.sub{font-size:13px;color:var(--muted);display:block;font-weight:400}
.list{display:grid;margin-top:4px}
.grp{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;padding:18px 4px 6px;border-bottom:2px solid var(--fg);font-weight:700}
.grp small{font-size:13px;font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.row{display:grid;grid-template-columns:1fr auto;gap:0 12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line)}
.model{font-weight:700;min-width:0;overflow-wrap:anywhere}
.qty{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.qty b{font-size:23px;display:block;line-height:1.2}
.qty small{font-size:12px;color:var(--muted);display:block;font-family:var(--sans)}
.badge{display:inline-block;border-radius:6px;padding:0 6px;font-size:12px;font-weight:700;font-family:var(--sans)}
.row.zero .qty b{color:var(--danger)}.row.zero .badge{background:var(--danger-bg);color:var(--danger)}
.row.low .qty b{color:var(--warn)}.row.low .badge{background:var(--warn-bg);color:var(--warn)}
.empty{padding:40px 8px;text-align:center;color:var(--muted)}
.foot{margin-top:24px;font-size:13px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top"><h1>庫存查詢</h1><span class="role">唯讀</span></div>
    <span class="status" id="status">讀取中…</span>
    <div class="tabs" role="tablist" id="tabs" hidden>
      <button type="button" class="tab" role="tab" data-v="stock" aria-selected="true">庫存</button>
      <button type="button" class="tab" role="tab" data-v="cons" aria-selected="false">客戶寄庫<small id="tabConsN"></small></button>
    </div>
    <div class="ctl" id="stockCtl">
    <div class="stats" id="stats">
      <button type="button" class="stat on" data-f=""><b id="sItems">–</b><span>全部商品</span></button>
      <button type="button" class="stat zero" data-f="zero"><b id="sZero">–</b><span>缺貨</span></button>
      <button type="button" class="stat low" data-f="low"><b id="sLow">–</b><span>庫存偏低</span></button>
    </div>
    <input id="q" type="search" placeholder="搜尋型號、品牌、類型、顏色" autocomplete="off">
    <div class="fsel">
      <select id="selBrand" aria-label="品牌"><option value="">全部品牌</option></select>
      <select id="selType" aria-label="商品類型"><option value="">全部類型</option></select>
    </div>
    <div class="finfo" id="finfo" hidden><span id="finfoText"></span><button type="button" id="fClear">清除篩選</button></div>
    </div>
    <div class="ctl" id="consCtl" hidden>
      <input id="cq" type="search" placeholder="搜尋客戶或商品" autocomplete="off">
      <select id="selCust" aria-label="客戶"><option value="">全部客戶</option></select>
      <div class="onlyitem" id="onlyItem" hidden><span id="onlyItemText"></span><button type="button" id="onlyItemClear">✕ 取消標示</button></div>
    </div>
  </header>
  <div class="list" id="list"><div class="empty">讀取中…</div></div>
  <div class="list" id="consList" hidden></div>
  <p class="foot">這是唯讀頁面，只能查看庫存與客戶寄庫數量。數字由管理者更新。</p>
</div>
<script>
/* ========== 唯讀公開頁 ==========
   資料來自同一個資料夾的 data.json（由進銷存頁的「更新公開頁」按鈕寫入）。
   先直接向 GitHub 讀最新版（推送後幾秒就是新資料），讀不到再讀網站上的檔案。
   頁面開著時每 2 分鐘檢查一次，切回畫面時也會馬上檢查。 */
const $=id=>document.getElementById(id);
const fmt=n=>Math.round(n).toLocaleString('zh-TW');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const GH='https://api.github.com/repos/swhite891714-creator/tw-traffic/contents/stock/data.json?ref=main';
// 頁面版本：每次改版都會換這個值。頁面開著時會定期檢查網站上的版本，不一樣就自動重新載入，
// 這樣手機不會一直停在瀏覽器暫存的舊版畫面
const PAGE_VER='2026-11-07.5';
async function checkVersion(){
  try{
    const t=await fetch('index.html?v='+Date.now(),{cache:'reload'}).then(r=>r.ok?r.text():'');
    const m=t.match(/const PAGE_VER='([^']+)'/);
    if(m&&m[1]!==PAGE_VER){await fetch('./',{cache:'reload'}).catch(()=>{});location.reload()}
  }catch(e){}
}
let data=null,statusF='',fBrand='',fType='';
// 品牌與商品類型（舊格式只有 cat 時當成類型）；「未填品牌」「未分類」排在最後
const bKey=i=>String(i.brand||'').trim()||'未填品牌';
const tKey=i=>String(i.type||i.cat||'').trim()||'未分類';
const groupOf=i=>bKey(i)+' · '+tKey(i);
const zh=(a,b)=>{const u=x=>x==='未填品牌'||x==='未分類'?1:0;return (u(a)-u(b))||String(a).localeCompare(String(b),'zh-Hant')};

async function load(){
  try{const r=await fetch(GH+'&t='+Date.now(),{cache:'no-store',headers:{Accept:'application/vnd.github.raw+json'}});if(r.ok){const j=await r.json();if(j&&Array.isArray(j.items))return j}}catch(e){}
  try{const r=await fetch('data.json?t='+Date.now(),{cache:'no-store'});if(r.ok)return await r.json()}catch(e){}
  return null;
}
// 更新時間顯示成台北時間，例如 11/07 15:42
function fmtAt(s){
  if(!s)return '';
  const d=new Date(new Date(s).getTime()+8*3600e3).toISOString();
  return `${d.slice(5,7)}/${d.slice(8,10)} ${d.slice(11,16)}`;
}
const nameOf=i=>[i.model,i.color].filter(Boolean).join(' · ');

/* 品牌、類型兩個下拉選單會互相連動：選了品牌，類型只剩這個品牌有的（反過來也一樣）；
   選項後面的數字是符合的商品項數 */
function renderFacets(items){
  const base=items.filter(i=>!statusF||i.st===statusF);
  const count=(arr,key)=>{const m={};arr.forEach(i=>{const k=key(i);m[k]=(m[k]||0)+1});return Object.entries(m).sort((a,b)=>zh(a[0],b[0]))};
  const fill=(sel,all,list,cur)=>{
    if(cur&&!list.some(([k])=>k===cur))list=[...list,[cur,0]];
    sel.innerHTML=`<option value="">${all}</option>`+list.map(([k,n])=>`<option value="${esc(k)}">${esc(k)}（${n}）</option>`).join('');
    sel.value=cur;sel.classList.toggle('on',!!cur);
  };
  fill($('selBrand'),'全部品牌',count(base.filter(i=>!fType||tKey(i)===fType),bKey),fBrand);
  fill($('selType'),'全部類型',count(base.filter(i=>!fBrand||bKey(i)===fBrand),tKey),fType);
  $('selBrand').parentNode.hidden=!items.length;
}
function render(){
  const items=(data&&data.items)||[];
  renderFacets(items);
  $('sItems').textContent=fmt(items.length);
  $('sZero').textContent=fmt(items.filter(i=>i.st==='zero').length);
  $('sLow').textContent=fmt(items.filter(i=>i.st==='low').length);
  document.querySelectorAll('.stat[data-f]').forEach(b=>b.classList.toggle('on',b.dataset.f===statusF));

  const list=$('list');
  if(!data){list.innerHTML='<div class="empty">目前讀不到資料，請確認網路後重新整理。</div>';return}
  if(!items.length){list.innerHTML='<div class="empty">管理者還沒有發布庫存資料。</div>';return}
  const q=$('q').value.trim().toLowerCase();
  const s=items.filter(i=>(!statusF||i.st===statusF)&&(!fBrand||bKey(i)===fBrand)&&(!fType||tKey(i)===fType)&&(!q||[i.brand,i.type,i.cat,i.model,i.color].join(' ').toLowerCase().includes(q)))
    .sort((a,b)=>zh(bKey(a),bKey(b))||zh(tKey(a),tKey(b)));
  const on=!!(fBrand||fType||statusF||q);$('finfo').hidden=!on;
  if(on)$('finfoText').textContent=`顯示 ${fmt(s.length)} / ${fmt(items.length)} 項`;
  if(!s.length){list.innerHTML=`<div class="empty">${statusF==='zero'?'目前沒有缺貨的商品':statusF==='low'?'目前沒有庫存偏低的商品':'找不到符合的商品'}</div>`;return}
  let html='',last=null;
  for(const i of s){
    if(groupOf(i)!==last){
      last=groupOf(i);const g=s.filter(x=>groupOf(x)===last);
      html+=`<div class="grp"><span>${esc(last)}</span><small>${g.length} 項</small></div>`;
    }
    const tag=(i.st==='zero'?'<span class="badge">缺貨</span>':i.st==='low'?'<span class="badge">偏低</span>':`<small>${esc(i.unit||'')}</small>`)+(+i.cq>0?`<button type="button" class="cqty" aria-label="查看 ${esc(nameOf(i))} 的客戶寄庫">寄庫 ${fmt(+i.cq)} ›</button>`:'');
    const k=items.indexOf(i);
    html+=`<div class="row ${esc(i.st)}${+i.cq>0?' hascons':''}"${+i.cq>0?` data-k="${k}"`:''}><span class="model">${esc(nameOf(i))}</span><span class="qty"><b>${fmt(+i.qty||0)}</b>${tag}</span></div>`;
  }
  list.innerHTML=html;
}
/* ---------- 客戶寄庫 ----------
   資料的 cons 是每位客戶寄放的商品（k＝商品在 items 裡的位置，q＝件數）。
   上方客戶選單可以只看某位客戶；搜尋可以找客戶名稱或商品。 */
let view='stock',fCust='',fItemK=-1;
// 從庫存清單點有寄庫的商品：切到客戶寄庫，仍顯示全部客戶的寄庫（不隱藏資料），
// 寄放這個商品的客戶排最前面、這個商品標成橘色，並捲到那一列
$('list').addEventListener('click',e=>{const r=e.target.closest('.row[data-k]');if(!r)return;fItemK=+r.dataset.k;fCust='';$('cq').value='';setView('cons');renderCons();
  const el=$('consList').querySelector('.row.hl');try{if(el)el.scrollIntoView({block:'center'});else window.scrollTo(0,0)}catch(x){}});
$('onlyItemClear').onclick=()=>{fItemK=-1;renderCons()};
const consOf=()=>((data&&data.cons)||[]).filter(c=>c&&c.name&&Array.isArray(c.items));
function renderCons(){
  const items=(data&&data.items)||[],cs=consOf();
  const tot=c=>c.items.reduce((n,x)=>n+(+x.q||0),0);
  $('tabs').hidden=!cs.length;
  $('tabConsN').textContent=cs.length?`${cs.length} 位`:'';
  if(!cs.length&&view==='cons')setView('stock');
  const sel=$('selCust');
  sel.innerHTML=`<option value="">全部客戶（${cs.length} 位）</option>`+cs.map(c=>`<option value="${esc(c.name)}">${esc(c.name)}（${fmt(tot(c))} 件）</option>`).join('');
  if(!cs.some(c=>c.name===fCust))fCust='';
  sel.value=fCust;sel.classList.toggle('on',!!fCust);
  const q=$('cq').value.trim().toLowerCase(),box=$('consList');
  const fi=fItemK>=0?items[fItemK]:null;
  if(fItemK>=0&&!(fi&&cs.some(c=>c.items.some(x=>x.k===fItemK&&+x.q>0))))fItemK=-1;
  $('onlyItem').hidden=fItemK<0;
  const has=c=>c.items.some(x=>x.k===fItemK&&+x.q>0);
  if(fItemK>=0)$('onlyItemText').textContent=`${nameOf(fi)}：`+cs.filter(has).map(c=>`${c.name} ${fmt(c.items.filter(x=>x.k===fItemK).reduce((a,x)=>a+(+x.q||0),0))} 件`).join('、');
  let html='',n=0;
  // 有寄放被標示商品的客戶排前面
  const order=fItemK>=0?[...cs].sort((a,b)=>has(b)-has(a)):cs;
  for(const c of order){
    if(fCust&&c.name!==fCust)continue;
    const rows=c.items.map(x=>({it:items[x.k],q:+x.q||0,k:x.k})).filter(x=>x.it&&x.q>0)
      .filter(x=>!q||c.name.toLowerCase().includes(q)||[x.it.brand,x.it.type,x.it.model,x.it.color].join(' ').toLowerCase().includes(q));
    if(!rows.length)continue;n++;
    html+=`<div class="cgrp"><span>${esc(c.name)}</span><small>${rows.length} 項 · 共 ${fmt(rows.reduce((a,x)=>a+x.q,0))} 件</small></div>`;
    html+=rows.map(x=>`<div class="row${x.k===fItemK?' hl':''}"><span class="model">${esc(nameOf(x.it))}<span class="sub">${esc(groupOf(x.it))}</span></span><span class="qty"><b>${fmt(x.q)}</b><small>${esc(x.it.unit||'')}</small></span></div>`).join('');
  }
  box.innerHTML=n?html:`<div class="empty">${cs.length?'找不到符合的客戶或商品':'目前沒有客戶寄庫'}</div>`;
}
// 切換「庫存／客戶寄庫」：在同一頁裡切換，網址不變
function setView(v){
  view=v;
  document.querySelectorAll('#tabs .tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===v?'true':'false'));
  $('stockCtl').hidden=$('list').hidden=v!=='stock';
  $('consCtl').hidden=$('consList').hidden=v!=='cons';
}
$('tabs').onclick=e=>{const b=e.target.closest('.tab');if(!b)return;if(b.dataset.v==='cons'&&fItemK>=0){fItemK=-1;renderCons()}setView(b.dataset.v)};
$('selCust').onchange=()=>{fCust=$('selCust').value;renderCons()};
$('cq').oninput=renderCons;

async function refresh(first){
  if(!first)checkVersion();
  const j=await load();
  if(j){data=j;$('status').textContent=j.at?`資料更新時間：${fmtAt(j.at)}`:'尚未發布';render();renderCons()}
  else if(first){$('status').textContent='讀取失敗';render()}
}
$('stats').onclick=e=>{const b=e.target.closest('.stat[data-f]');if(!b)return;statusF=b.dataset.f===statusF?'':b.dataset.f;render()};
$('q').oninput=render;
$('selBrand').onchange=()=>{fBrand=$('selBrand').value;
  const it=(data&&data.items)||[];if(fType&&!it.some(i=>(!fBrand||bKey(i)===fBrand)&&tKey(i)===fType))fType='';render()};
$('selType').onchange=()=>{fType=$('selType').value;
  const it=(data&&data.items)||[];if(fBrand&&!it.some(i=>(!fType||tKey(i)===fType)&&bKey(i)===fBrand))fBrand='';render()};
$('fClear').onclick=()=>{fBrand='';fType='';statusF='';$('q').value='';render()};
refresh(true);
setTimeout(checkVersion,3000);
setInterval(()=>{if(!document.hidden)refresh()},120000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
</script>
</body>
</html>
