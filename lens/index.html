<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="鏡頭翻譯">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<!-- 連接 Claude：用你自己的 API 金鑰（只存在你的手機裡） -->
<script src="claude-api.js" charset="utf-8"></script>
<title>鏡頭即時翻譯</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one column. Translated photo first (the answer), then a reading card that pairs names with prices, then settings. */
:root{
  --bg:#101214; --panel:#1a1d20; --line:#2b3035; --fg:#eef0ee; --muted:#9aa3a8;
  --focus:#f2c14e; --focus-ink:#1a1405; --err:#ff8a7a;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.55;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding-block:16px 48px;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:20px;font-weight:700;margin:0;text-wrap:balance}
.tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.figure{position:relative;border-radius:14px;overflow:hidden;background:#000;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:pan-y}
.figure canvas{display:block;width:100%;height:auto;max-width:100%}
.figure canvas.orig{position:absolute;inset:0;width:100%;height:100%;clip-path:inset(0 calc(100% - var(--split,0%)) 0 0)}
.hl{position:absolute;inset:0;pointer-events:none}
.hl i{position:absolute;border:3px solid var(--focus);border-radius:6px;animation:pulse 1.2s ease-out 2}
@keyframes pulse{0%{transform:scale(1.2);opacity:0}40%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.hl i,.scan{animation:none}}
.badge{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.62);color:#fff;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;padding:4px 10px;border-radius:99px;white-space:nowrap;pointer-events:none}
.splitline{position:absolute;top:0;bottom:0;left:var(--split,0%);width:0;border-left:2px solid #fff;box-shadow:0 0 8px rgba(0,0,0,.6);pointer-events:none}
.splitline::after{content:"原文 ｜ 譯文";position:absolute;top:50%;left:0;transform:translate(-50%,-50%);background:#fff;color:#111;font:700 11px/1 var(--f-body);padding:6px 8px;border-radius:99px;white-space:nowrap}
.busy{position:absolute;inset:0;background:rgba(10,12,14,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-weight:500;color:#fff}
.scan{width:60%;height:2px;background:var(--focus);box-shadow:0 0 12px var(--focus);animation:scan 1.4s ease-in-out infinite alternate}
@keyframes scan{from{transform:translateY(-40px)}to{transform:translateY(40px)}}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools .grow{flex:1 1 auto}
input[type=range]{width:100%;accent-color:var(--focus)}
.slider{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.slider span{white-space:nowrap}

.shoot{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--focus);color:var(--focus-ink);font:inherit;font-size:17px;font-weight:700;border:0;border-radius:999px;padding:14px 22px;cursor:pointer;white-space:nowrap}
.shoot[aria-disabled="true"]{opacity:.5;pointer-events:none}
.ghost{font:inherit;font-size:13px;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;white-space:nowrap}
.ghost[aria-pressed="true"]{border-color:var(--focus);color:var(--focus)}
.shoot:focus-visible,button:focus-visible,select:focus-visible,label[role=button]:focus-visible,input:focus-visible,.rows li:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.hidden-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.msg{font-size:14px;color:var(--muted);margin:0}
.msg.err{color:var(--err)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.summary{font-size:16px;font-weight:500;margin:0;text-wrap:pretty}
.curline{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:13px;color:var(--muted);padding-top:10px;border-top:1px solid var(--line)}
.curline b{color:var(--focus)}
.curline .warn{color:var(--err);flex-basis:100%}
.curline select{width:auto;font-size:12px;padding:3px 8px;border-radius:8px;margin-left:auto}
.sec h3{margin:6px 0 2px;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.rows{list-style:none;margin:0;padding:0}
.rows li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 14px;padding:12px 8px;margin:0 -8px;border-radius:10px;cursor:pointer;border-bottom:1px solid var(--line)}
.rows li:last-child{border-bottom:0}
.rows li.on{background:color-mix(in srgb,var(--focus) 12%,transparent)}
.rows .name{font-size:17px;font-weight:700;line-height:1.35;min-width:0;overflow-wrap:anywhere;grid-column:1}
.rows .orig{font-size:13px;color:var(--muted);min-width:0;overflow-wrap:anywhere;grid-column:1}
.rows .note{font-size:13px;color:var(--fg);opacity:.8;grid-column:1;min-width:0}
.rows .px{grid-column:2;grid-row:1/4;align-self:center;text-align:right;display:flex;flex-direction:column;gap:2px}
.rows .px b{font-family:var(--f-mono);font-size:17px;color:var(--focus);font-variant-numeric:tabular-nums;white-space:nowrap}
.rows .px span{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}

.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.field{display:flex;flex-direction:column;gap:4px;min-width:0}
select{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
details.box{border-top:1px solid var(--line);padding-top:10px}
details.box summary{cursor:pointer;display:flex;gap:8px;align-items:baseline;color:var(--muted);font-size:13px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:10px 0}
.rgrid label{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-family:var(--f-mono);font-size:12px;min-width:0}
.rgrid input{font:inherit;color:var(--fg);background:transparent;border:0;width:100%;min-width:0;text-align:right;font-variant-numeric:tabular-nums}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;padding:2px;background:var(--panel)}
.seg button{font:inherit;font-size:13px;border:0;background:transparent;color:var(--muted);padding:6px 12px;border-radius:99px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);font-weight:700}
.slider.grow{flex:1 1 180px}

.crop{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.cbar{display:flex;align-items:center;gap:10px;padding:10px max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px))}
.cbar .grow{flex:1}
.cbar .ghost{color:#fff;border-color:#444}
.cbar .shoot{font-size:15px;padding:12px 20px}
.crot{display:flex;align-items:center;gap:8px;padding:6px max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px));color:#fff;font-size:13px;flex-wrap:wrap}
.crot .ghost{color:#fff;border-color:#444;padding:7px 12px}
.crot input[type=range]{flex:1 1 140px;min-width:120px}
.crot .cdeg{font-family:var(--f-mono);min-width:4.5em;text-align:right;color:#ccc}
.crot .cnote{width:100%;color:var(--focus);font-size:12px;min-height:1em}
.ctitle{flex:1;text-align:center;color:#fff;font-weight:500;font-size:14px}
.cstage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:14px max(22px,env(safe-area-inset-right,0px)) 14px max(22px,env(safe-area-inset-left,0px))}
.cbox{position:relative;touch-action:none;-webkit-user-select:none;user-select:none}
.cbox canvas{display:block}
.crect{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.6);cursor:move;background-image:linear-gradient(rgba(255,255,255,.25) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.25) 1px,transparent 1px);background-size:33.34% 33.34%;background-position:-1px -1px}
.cbox{overflow:hidden}
.crect .hd{position:absolute;width:30px;height:30px;border:4px solid var(--focus)}
.crect .nw{top:0;left:0;border-right:0;border-bottom:0;cursor:nwse-resize}
.crect .ne{top:0;right:0;border-left:0;border-bottom:0;cursor:nesw-resize}
.crect .sw{bottom:0;left:0;border-right:0;border-top:0;cursor:nesw-resize}
.crect .se{bottom:0;right:0;border-left:0;border-top:0;cursor:nwse-resize}
.crect .hd::after{content:"";position:absolute;inset:-14px}
.crect .ed{position:absolute}
.crect .n,.crect .s{left:30px;right:30px;height:28px}.crect .n{top:-14px;cursor:ns-resize}.crect .s{bottom:-14px;cursor:ns-resize}
.crect .w,.crect .e{top:30px;bottom:30px;width:28px}.crect .w{left:-14px;cursor:ew-resize}.crect .e{right:-14px;cursor:ew-resize}

.changes{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:color-mix(in srgb,var(--bg) 40%,var(--panel))}
.changes>summary{cursor:pointer;font-weight:700;font-size:14px}
.chlist{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column}
.chlist li{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;padding:8px 6px;margin:0 -6px;border-radius:8px;border-top:1px solid var(--line);cursor:pointer;font-size:14px}
.chlist li.on{background:color-mix(in srgb,var(--focus) 12%,transparent)}
.chlist .where{font-size:11px;color:var(--focus-ink);background:var(--focus);border-radius:99px;padding:1px 8px;font-weight:700}
.chlist .from{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 60%,transparent);min-width:0;overflow-wrap:anywhere}
.chlist .arrow{color:var(--muted);font-size:12px}
.chlist .to{font-weight:700;min-width:0;overflow-wrap:anywhere}
.chlist .lit{flex-basis:100%;font-size:12px;color:var(--muted)}
.chlist .kind{flex-basis:100%;font-size:12px;color:var(--focus)}

.full{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.full .bar{display:flex;gap:8px;align-items:center;padding:10px max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px))}
.full .bar .grow{flex:1}
.full .scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.full img{display:block;max-width:none;margin:0 auto}
.full .ghost{color:#fff;border-color:#444}

/* ===== 語音翻譯對話 ===== */
/* 語音畫面直接放在頁面裡（不用蓋在最上層），在 Claude App 裡才不會跑版、點不到 */
.talk{max-width:560px;margin:0 auto;padding-block:8px 48px;display:flex;flex-direction:column;gap:10px}
.talk .thead{display:flex;gap:6px;align-items:center;padding:8px 0 4px;flex-wrap:nowrap}
.talk .thead .ghost{padding:7px 10px}
.talk .thead h2{font-size:17px;margin:0 auto 0 0}
.talk select{width:auto;min-width:0;flex:0 1 auto;font:inherit;font-size:15px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.tlog{display:flex;flex-direction:column;gap:8px;padding:4px 0}
.tlog:empty::before{font-size:13px!important;content:"對方說話時，按上方黃色按鈕用手機錄影（只要錄到聲音即可，畫面不重要），停止後幾秒就會出現中文翻譯。第一次使用要下載約 100MB 的辨識模型，建議連 Wi-Fi。";color:var(--muted);font-size:14px;line-height:1.7;margin:auto 4px}
.tb{max-width:88%;border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:4px}
.tb.them{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}
.tb.me{align-self:flex-end;background:#2a2410;border:1px solid #5a4a1a}
.tb .to{font-size:12px;color:var(--muted)}
.tb .tt{font-size:16px;font-weight:700;line-height:1.45}
.tb .tg{font-size:12px;color:var(--focus)}
.tb .ta{display:flex;gap:6px;flex-wrap:wrap}
.tbtn{font:inherit;font-size:12px;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:99px;padding:5px 10px;cursor:pointer}
.tsug{display:flex;flex-wrap:wrap;gap:6px;border-top:1px dashed var(--line);padding-top:8px}
.tsl{width:100%;font-size:12px;color:var(--muted)}
.tchip{font:inherit;font-size:13px;color:var(--focus-ink);background:var(--focus);border:0;border-radius:99px;padding:6px 12px;cursor:pointer}
.tfoot{display:flex;flex-direction:column;gap:8px;padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.tfoot .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tfoot textarea{display:block;width:100%;box-sizing:border-box;min-height:56px;max-height:40vh;resize:none;font:inherit;font-size:17px;line-height:1.5;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}
.tfoot textarea:focus{outline:2px solid var(--focus);outline-offset:0;border-color:transparent}
.tfoot .tsend{flex:1 1 130px;min-width:0;font-size:16px;padding:12px 16px}
.tfoot .row .ghost{padding:11px 14px;font-size:14px}

.tstatus{font-size:13px;color:var(--muted)}
.tstatus:empty{display:none}
#tThemRow{flex-wrap:nowrap}
#tThemRow .shoot{min-width:0;font-size:16px;padding-inline:12px;white-space:nowrap}
.tstatus.err{color:var(--err)}
.tbar{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.tbar i{display:block;height:100%;width:0;background:var(--focus);transition:width .2s}
.tsmall{font-size:12px;color:var(--muted)}
/* 放大給對方看：出現在語音畫面最上方的白色大字卡，點一下關閉 */
.tbig{background:#fff;color:#111;border-radius:14px;display:flex;align-items:center;justify-content:center;padding:16px 14px;font-size:clamp(22px,6.5vw,34px);font-weight:900;line-height:1.35;text-align:center;word-break:break-word;cursor:pointer}

/* ===== 操作介面優化 ===== */
/* 常用設定：放在最上面，一眼看到要翻成什麼、價格換成什麼 */
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quick .field{gap:4px}
.quick select{padding-block:8px;font-size:15px}
/* 下方固定操作列：拇指最好按的位置，捲到哪裡都按得到 */
.dock{position:sticky;bottom:0;z-index:20;display:grid;grid-template-columns:1fr 2fr 1fr;gap:8px;align-items:stretch;
  margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px)) max(10px,env(safe-area-inset-bottom,0px));
  background:linear-gradient(to top,var(--bg) 82%,transparent)}
.dock .shoot{padding:14px 10px;font-size:17px}
.dock .side{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:inherit;font-size:12px;font-weight:600;color:var(--fg);
  background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:8px 4px;cursor:pointer;white-space:nowrap;min-height:52px}
.dock .side b{font-size:20px;line-height:1}
.dock .side:active,.dock .shoot:active{transform:scale(.97)}
/* 結果相關的按鈕：沒有照片前不顯示，讓畫面乾淨 */
.after[hidden]{display:none}
details.more{border-top:1px solid var(--line);padding-top:10px}
details.more>summary{cursor:pointer;font-size:14px;color:var(--muted);padding:6px 0}
details.more .controls{margin-top:10px}
</style>

<div class="wrap">
  <header>
    <h1>鏡頭即時翻譯</h1>
    <span class="tag">線上版・第 22 版</span>
  </header>

  <!-- 常用設定：翻成哪種語言、價格換成哪種幣別 -->
  <div class="quick">
    <label class="field" for="lang"><span class="tag">翻譯成</span>
      <select id="lang">
        <option value="繁體中文（台灣用語）">繁體中文</option>
        <option value="English">English</option>
        <option value="日本語">日本語</option>
        <option value="한국어">한국어</option>
        <option value="Tiếng Việt">Tiếng Việt</option>
        <option value="ภาษาไทย">ภาษาไทย</option>
        <option value="Bahasa Indonesia">Bahasa Indonesia</option>
      </select>
    </label>
    <label class="field" for="target"><span class="tag">價格換算成</span>
      <select id="target"></select>
    </label>
  </div>
  <div class="figure" id="figure">
    <canvas id="out" aria-label="翻譯後的畫面"></canvas>
    <canvas id="orig" class="orig" aria-hidden="true"></canvas>
    <div class="splitline" id="splitline" hidden></div>
    <div class="hl" id="hl"></div>
    <span class="badge" id="badge">範例畫面</span>
    <div class="busy" id="busy" hidden><div class="scan"></div><span id="busyText">辨識並翻譯中…</span></div>
  </div>

  <div class="tools">
    <div class="seg" role="group" aria-label="照片上要換掉哪些字">
      <button type="button" data-ov="all" aria-pressed="true">全部翻譯</button>
      <button type="button" data-ov="price" aria-pressed="false">只換價格</button>
    </div>
    <div class="slider grow">
      <span>譯文</span>
      <input type="range" id="split" min="0" max="100" value="0" aria-label="拖曳對照原文">
      <span>原文</span>
    </div>
  </div>

  <!-- 第二排：照片相關的操作（重新選範圍、放大、儲存、重新翻譯） -->
  <div class="tools">
    <button class="ghost" id="recropBtn" type="button" hidden>✂ 重新選範圍</button>
    <button class="ghost" id="fullBtn" type="button">🔍 放大檢視</button>
    <button class="ghost" id="saveBtn" type="button" hidden>⬇ 儲存翻譯圖</button>
    <button class="ghost" id="retryBtn" type="button" hidden>↻ 重新翻譯</button>
  </div>
  <p class="msg" id="msg">按住照片可看原文，或拖曳滑桿對照。點下方項目會在照片上標出位置。</p>

  <section class="card" id="card" aria-label="整理後的內容">
    <p class="summary" id="summary"></p>
    <details class="changes" id="changes" open hidden>
      <summary id="chTitle"></summary>
      <ol class="chlist" id="chList"></ol>
    </details>
    <div id="sections"></div>
    <div class="curline" id="curline" hidden></div>
  </section>

  <!-- 比較少改的設定收在這裡 -->
  <details class="more" id="moreBox">
    <summary>更多設定（所在地、翻譯風格、匯率）</summary>
    <div class="controls">
    <label class="field" for="srcCur"><span class="tag">你現在在哪</span>
      <select id="srcCur"></select>
    </label>
    <label class="field" for="style"><span class="tag">翻譯風格</span>
      <select id="style">
        <option value="local">在地化（像商品文案）</option>
        <option value="literal">忠實直譯</option>
      </select>
    </label>
    </div>
  <details class="box" id="ratesBox">
    <summary><span class="tag">匯率</span> <span id="rateSrc"></span></summary>
    <p class="msg">1 單位外幣兌新台幣。數字可以直接改，改過的會記在這支手機上。</p>
    <div class="rgrid" id="rgrid"></div>
    <button class="ghost" id="resetRates" type="button">還原預設匯率</button>
  </details>
  </details>

<script>
(function(){

    [/S\$|SGD|新幣/i,"SGD"],[/C\$|CA\$|CAD|加幣/i,"CAD"],[/A\$|AUD|澳幣/i,"AUD"],

    [/€|EUR\b|歐元/i,"EUR"],[/£|GBP|英鎊/i,"GBP"],[/฿|บาท|THB|泰銖/i,"THB"],
    [/₫|VND|đồng|\d\s*đ(?![a-zà-ỹ])/i,"VND"],[/₱|PHP\b|披索/i,"PHP"],[/\bRp\.?\s?\d|IDR|rupiah/i,"IDR"],

  const AMBIG=[[/\$/,"$",["USD","TWD","HKD","SGD","AUD","CAD"]],[/[¥￥]/,"¥",["JPY","CNY"]],[/元/,"元",["TWD","CNY","HKD"]]];
  function detectFromText(t){

  }
  let rates={...DEFAULT_RATES};

  tgtSel.addEventListener("change",()=>{try{localStorage.setItem("lens.target",tgtSel.value)}catch(_){}refresh()});

  $("lang").addEventListener("change",e=>{try{localStorage.setItem("lens.lang",e.target.value)}catch(_){}});
  $("rateSrc").textContent=RATE_DATE;

  function fmt(v,c){let d=CUR[c]?CUR[c][2]:2;if(v<1&&v>0)d=Math.max(d,3);if(v>=1000)d=0;return (CUR[c]?CUR[c][1]:c+" ")+v.toLocaleString("en-US",{maximumFractionDigits:d,minimumFractionDigits:0})}
  // order: your pick → marker written in the price → where you are → AI read of the scene
  function resolveCur(p){
    if(!p)return null;
    if(curOverride&&CUR[curOverride])return {code:curOverride,how:"manual"};
    const d=detectFromText(p.original||"");

    const reg=REGION[srcSel.value];
    if(reg&&(!d||d.list.includes(reg.cur)))return {code:reg.cur,how:"region",sym:d&&d.sym};
    const ai=(p.currency&&CUR[p.currency])?p.currency:(scene&&CUR[scene.code]?scene.code:null);

  }
  function convert(p){
    const r=resolveCur(p),to=tgtSel.value;if(!r||!r.code)return null;
    const amt=Number(p.amount);if(!isFinite(amt))return null;
    if(!to||!rates[r.code]||!rates[to]||r.code===to)return {from:r.code,to:r.code,amt,out:amt,same:true};
    return {from:r.code,to,amt,out:amt*rates[r.code]/rates[to],same:false};
  }
  function buildRates(){
    const g=$("rgrid");g.innerHTML="";
    for(const k in CUR){if(k==="TWD")continue;
      const l=document.createElement("label");l.htmlFor="rate-"+k;l.textContent=k;
      const i=document.createElement("input");i.id="rate-"+k;i.type="number";i.inputMode="decimal";i.step="any";i.value=rates[k];
      i.addEventListener("change",()=>{const v=parseFloat(i.value);if(v>0){rates[k]=v;saveRates();refresh()}else i.value=rates[k]});
      l.appendChild(i);g.appendChild(l);
    }
  }
  function saveRates(){try{localStorage.setItem("lens.rates",JSON.stringify(rates))}catch(e){}}
  $("resetRates").addEventListener("click",()=>{rates={...DEFAULT_RATES};try{localStorage.removeItem("lens.rates")}catch(e){}buildRates();refresh()});
  buildRates();

  // ================= Translated image: cover each original text with its surrounding color, draw the translation in =================
  const boxOf=it=>{const b=it&&Array.isArray(it.box)&&it.box.length===4?it.box.map(Number):null;
    if(!b||!b.every(n=>isFinite(n)))return null;
    const x=Math.min(Math.max(0,b[0]),.99),y=Math.min(Math.max(0,b[1]),.99);
    return [x,y,Math.min(Math.max(b[2],.002),1-x),Math.min(Math.max(b[3],.002),1-y)]};   // 最小 0.2%：長條照片裡的小字框不會被硬撐大
  const lum=c=>{const f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};return .2126*f(c[0])+.7152*f(c[1])+.0722*f(c[2])};
  const contrast=(a,b)=>{const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
  const rgb=c=>`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;
  function px(x,y){x=Math.max(0,Math.min(src.width-1,x|0));y=Math.max(0,Math.min(src.height-1,y|0));const i=(y*src.width+x)*4;return [pixels[i],pixels[i+1],pixels[i+2]]}
  function edgeColor(x,y,w,h){
    const s=[],step=Math.max(2,Math.round((w+h)/80));
    for(let i=0;i<=w;i+=step){s.push(px(x+i,y));s.push(px(x+i,y+h))}
    for(let j=0;j<=h;j+=step){s.push(px(x,y+j));s.push(px(x+w,y+j))}
    const med=k=>{const a=s.map(c=>c[k]).sort((p,q)=>p-q);return a[a.length>>1]};
    return [med(0),med(1),med(2)];
  }
  function inkColor(x,y,w,h,bg){
    const cand=[],step=Math.max(1,Math.round(Math.sqrt(w*h)/40));
    for(let j=0;j<h;j+=step)for(let i=0;i<w;i+=step){const c=px(x+i,y+j);const d=Math.abs(c[0]-bg[0])+Math.abs(c[1]-bg[1])+Math.abs(c[2]-bg[2]);if(d>90)cand.push([d,c])}
    let ink=null;
    if(cand.length>8){cand.sort((a,b)=>b[0]-a[0]);const top=cand.slice(0,Math.max(4,cand.length*.3|0));ink=[0,1,2].map(k=>top.reduce((s,v)=>s+v[1][k],0)/top.length)}
    if(!ink||contrast(ink,bg)<3)ink=lum(bg)>.35?[20,20,22]:[250,250,248];
    return ink;
  }
  const TOKEN=/[⺀-鿿가-힯豈-﫿＀-￯　-〿]|[^\s⺀-鿿가-힯豈-﫿＀-￯　-〿]+|\s+/g;
  function wrap(ctx,text,maxW){
    const toks=text.match(TOKEN)||[text];const lines=[];let cur="";
    for(const t of toks){
      const next=cur+t;
      if(ctx.measureText(next.trimEnd()).width<=maxW||!cur.trim()){cur=next}
      else{lines.push(cur.trim());cur=t.trimStart()}
    }
    if(cur.trim())lines.push(cur.trim());
    return lines;
  }
  function balance(ctx,text,maxW){
    const greedy=wrap(ctx,text,maxW);if(greedy.length<2)return greedy;
    let lo=maxW*.5,hi=maxW,best=greedy;
    for(let i=0;i<12;i++){const mid=(lo+hi)/2,L=wrap(ctx,text,mid);if(L.length<=greedy.length){best=L;hi=mid}else lo=mid}
    return best;
  }
  const FAM="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif";
  function rr(ctx,x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);ctx.fill()}
  // ---------- Find text lines in the photo itself (edges → horizontal smear → connected blobs) ----------
  let comps=null;
  function detectComps(){
    const W=src.width,H=src.height,s=Math.min(1,720/Math.max(W,H)),w=Math.max(8,Math.round(W*s)),h=Math.max(8,Math.round(H*s));
    const t=document.createElement("canvas");t.width=w;t.height=h;const tc=t.getContext("2d",{willReadFrequently:true});tc.drawImage(src,0,0,w,h);
    const d=tc.getImageData(0,0,w,h).data,g=new Float32Array(w*h);
    for(let i=0;i<w*h;i++)g[i]=.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2];
    const e=new Float32Array(w*h);let sum=0,sq=0;
    for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const i=y*w+x;const v=Math.abs(g[i+1]-g[i-1])+Math.abs(g[i+w]-g[i-w]);e[i]=v;sum+=v;sq+=v*v}
    const n=w*h,mean=sum/n,sd=Math.sqrt(Math.max(0,sq/n-mean*mean)),thr=Math.max(36,mean+1.2*sd);
    const m=new Uint8Array(n);for(let i=0;i<n;i++)m[i]=e[i]>thr?1:0;
    const k=Math.max(3,Math.round(w/80));
    for(let y=0;y<h;y++){let last=-1;for(let x=0;x<w;x++){if(m[y*w+x]){if(last>=0&&x-last>1&&x-last<=k)for(let z=last+1;z<x;z++)m[y*w+z]=2;last=x}}}
    for(let x=0;x<w;x++){let last=-1;for(let y=0;y<h;y++){if(m[y*w+x]){if(last>=0&&y-last>1&&y-last<=2)for(let z=last+1;z<y;z++)m[z*w+x]=2;last=y}}}
    const lab=new Int32Array(n),out=[],st=[];let id=0;
    for(let i=0;i<n;i++){if(!m[i]||lab[i])continue;id++;let x0=w,y0=h,x1=0,y1=0,c=0;st.push(i);lab[i]=id;
      while(st.length){const j=st.pop(),x=j%w,y=(j/w)|0;c++;if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;
        if(x>0&&m[j-1]&&!lab[j-1]){lab[j-1]=id;st.push(j-1)}if(x<w-1&&m[j+1]&&!lab[j+1]){lab[j+1]=id;st.push(j+1)}
        if(y>0&&m[j-w]&&!lab[j-w]){lab[j-w]=id;st.push(j-w)}if(y<h-1&&m[j+w]&&!lab[j+w]){lab[j+w]=id;st.push(j+w)}}
      const bw=x1-x0+1,bh=y1-y0+1;
      if(bh>=4&&bw>=4&&bh<=h*.3&&c/(bw*bh)>.22&&!(bw>w*.9&&bh>h*.15))out.push({x:x0/s,y:y0/s,w:bw/s,h:bh/s})}
    return out;
  }
  // Move each AI box onto the text lines actually found near it
  function snap(A){
    if(!comps||!comps.length)return A;
    const E={x:A.x-(A.w*.15+A.h*.5),y:A.y-A.h*.6,x2:A.x+A.w+(A.w*.15+A.h*.5),y2:A.y+A.h*1.6};
    const c=comps.filter(b=>{const cx=b.x+b.w/2,cy=b.y+b.h/2;return cx>E.x&&cx<E.x2&&cy>E.y&&cy<E.y2&&b.h<=A.h*2.2&&(b.h>=A.h*.3||(cy>=A.y&&cy<=A.y+A.h&&cx>=A.x-A.h&&cx<=A.x+A.w+A.h))});
    if(!c.length)return A;
    let x1=Math.max(E.x,Math.min(...c.map(b=>b.x))),y1=Math.max(E.y,Math.min(...c.map(b=>b.y)));
    let x2=Math.min(E.x2,Math.max(...c.map(b=>b.x+b.w))),y2=Math.min(E.y2,Math.max(...c.map(b=>b.y+b.h)));
    const U={x:x1,y:y1,w:x2-x1,h:y2-y1};
    if(U.w<4||U.h<4||U.h>A.h*1.9||U.w>A.w*1.9+A.h)return A;

  }
  // Split boxes that overlap so one erase never eats another's text
  function separate(rs){
    for(let i=0;i<rs.length;i++)for(let j=i+1;j<rs.length;j++){
      const a=rs[i],b=rs[j];
      const ox=Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x),oy=Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y);
      if(ox<=0||oy<=0)continue;
      if(oy<=ox){const [t,u]=a.y<=b.y?[a,b]:[b,a];const m=Math.max(t.y,u.y)+oy/2;t.h=Math.max(4,m-t.y-1);const bot=u.y+u.h;u.y=m+1;u.h=Math.max(4,bot-u.y)}
      else{const [l,q]=a.x<=b.x?[a,b]:[b,a];const m=Math.max(l.x,q.x)+ox/2;l.w=Math.max(4,m-l.x-1);const right=q.x+q.w;q.x=m+1;q.w=Math.max(4,right-q.x)}
    }
  }
  // how many text lines sit inside a box, from the lines found in the photo
  function countLines(r){
    if(!comps)return 1;
    const c=comps.filter(b=>{const cx=b.x+b.w/2,cy=b.y+b.h/2;return cx>=r.x&&cx<=r.x+r.w&&cy>=r.y&&cy<=r.y+r.h&&b.w>b.h*.5}).sort((a,b)=>(a.y+a.h/2)-(b.y+b.h/2));

          if(!acc.some(o=>iou(o.box,it.box)>.5||(norm(o.original)===norm(it.original)&&near(o.box,it.box))||ovSmall(o.box,it.box)>.4||sameSlot(o.box,it.box)))acc.push(it)});
        merged=acc.sort((a,b)=>(a.box[1]-b.box[1])||(a.box[0]-b.box[0]))}
      items=merged;
      sections=[{heading:"",rows:items.map((it,i)=>({name:it.translation,original:it.original,note:"",price_ids:it.price?[i]:[],ids:[i]}))}];
      const ps=items.filter(i=>i.price&&CUR[i.price.currency]);scene=ps.length?{code:ps[0].price.currency,reason:"AI 從畫面判斷"}:null;
      refresh();
      const secs=((performance.now()-t0)/1000).toFixed(1);
      if(!items.length)msg.textContent="畫面中沒有找到文字，換個角度再拍一張。";
      else{badge.textContent="已翻譯・潤飾中";msg.textContent=`找到 ${items.length} 段文字，耗時 ${secs} 秒。正在潤飾譯文，完成後會自動更新…`;
        const myCtl=ctl;
        polish(lang,styleRule,myCtl.signal,regionHint).then(ok=>{if(myCtl!==ctl)return;badge.textContent="已翻譯";
          msg.textContent=ok?`已完成並潤飾 ${items.length} 段文字。按住照片看原文，點下方項目標出位置。`:`找到 ${items.length} 段文字。按住照片看原文，點下方項目標出位置。`});}
    }catch(e){
      if(e&&e.code==="cancelled")return;
      msg.className="msg err";msg.textContent=ERR[e&&e.code]||(e&&e.message&&/[\u4e00-\u9fff]/.test(e.message)?e.message:"翻譯失敗，請按「重新翻譯」。");   // 有中文說明的錯誤（例如金鑰、額度）直接顯示$("retryBtn").hidden=false;
    }finally{clearInterval(tick);busy.hidden=true;$("shootBtn").removeAttribute("aria-disabled");$("busyText").textContent="辨識並翻譯中…"}
  }
